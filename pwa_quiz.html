<style>
:root{
  --paper:#EFF2F6; --card:#FFFFFF; --ink:#1C2333; --ink-soft:#545E72;
  --line:#D8DEE8; --accent:#1F4E8C; --accent-soft:#E6EDF7;
  --correct:#2F7D5D; --correct-soft:#E4F3EC;
  --wrong:#C23B33; --wrong-soft:#FBE7E5;
  --warn:#B9790E; --warn-soft:#FBF0DC;
  --font-ui:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Consolas,'D2Coding',monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1420; --card:#171E2C; --ink:#E7ECF5; --ink-soft:#98A3B8;
    --line:#2B3547; --accent:#6FA3E0; --accent-soft:#1E2E44;
    --correct:#6FCBA0; --correct-soft:#163628;
    --wrong:#E88079; --wrong-soft:#3A1E1D;
    --warn:#E8B85B; --warn-soft:#3A2E14;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1420; --card:#171E2C; --ink:#E7ECF5; --ink-soft:#98A3B8;
  --line:#2B3547; --accent:#6FA3E0; --accent-soft:#1E2E44;
  --correct:#6FCBA0; --correct-soft:#163628;
  --wrong:#E88079; --wrong-soft:#3A1E1D;
  --warn:#E8B85B; --warn-soft:#3A2E14;
}
:root[data-theme="light"]{
  --paper:#EFF2F6; --card:#FFFFFF; --ink:#1C2333; --ink-soft:#545E72;
  --line:#D8DEE8; --accent:#1F4E8C; --accent-soft:#E6EDF7;
  --correct:#2F7D5D; --correct-soft:#E4F3EC;
  --wrong:#C23B33; --wrong-soft:#FBE7E5;
  --warn:#B9790E; --warn-soft:#FBF0DC;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  background:
    radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px,
    var(--paper);
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.app-shell{max-width:720px;margin:0 auto;padding:20px 16px 64px;}
a{color:inherit;}
button{font-family:inherit;}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin-bottom:16px;flex-wrap:wrap;
}
.brand h1{font-size:1.25rem;margin:0 0 2px;letter-spacing:-.01em;}
.brand p{font-size:.82rem;color:var(--ink-soft);margin:0;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  padding:7px 12px;border-radius:8px;font-size:.82rem;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.tab-btn:hover{border-color:var(--accent);color:var(--ink);}
.tab-btn.is-active{background:var(--accent);border-color:var(--accent);color:#fff;}
.quit-btn{
  border:1px solid var(--wrong);color:var(--wrong);background:var(--wrong-soft);
  padding:7px 14px;border-radius:8px;font-size:.82rem;cursor:pointer;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:18px;margin-bottom:14px;
}
.stat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stat-tile{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 12px;text-align:center;
}
.stat-tile .label{font-size:.68rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;}
.stat-tile .value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:600;color:var(--accent);}
.section-title{font-size:.95rem;font-weight:700;margin:0 0 10px;}
.chip-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  padding:8px 14px;border-radius:999px;font-size:.84rem;cursor:pointer;
}
.chip.is-active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.primary-btn{
  width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
}
.primary-btn:hover{filter:brightness(1.06);}
.ghost-btn{
  padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;
  color:var(--ink);font-size:.86rem;cursor:pointer;
}
.cta-card{
  border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:14px;flex-wrap:wrap;
}
.cta-card strong{color:var(--warn);}
.progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease;}
@media (prefers-reduced-motion:reduce){.progress-fill{transition:none;}}
.pill{
  display:inline-flex;align-items:center;font-size:.72rem;font-weight:600;
  padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
  letter-spacing:.02em;
}
.pill.tag{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);}
.qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.qcounter{margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink-soft);}
.qtext{font-size:1.08rem;line-height:1.55;font-weight:600;margin:0 0 16px;text-wrap:balance;}
.choice-list{display:flex;flex-direction:column;gap:8px;margin-bottom:4px;}
.choice-btn{
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:12px 14px;font-size:.92rem;cursor:pointer;color:var(--ink);
  line-height:1.4;
}
.choice-btn .num{font-size:1rem;flex:none;color:var(--ink-soft);}
.choice-btn:hover:not(.is-disabled){border-color:var(--accent);}
.choice-btn.is-correct{background:var(--correct-soft);border-color:var(--correct);color:var(--correct);font-weight:700;}
.choice-btn.is-wrong{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong);font-weight:700;}
.choice-btn.is-disabled{cursor:default;}
.explain{
  margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.86rem;line-height:1.55;
  background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);
}
.explain b{color:var(--ink);}
.qfooter{display:flex;justify-content:flex-end;margin-top:14px;}
.result-score{text-align:center;padding:26px 16px;}
.result-score .big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:2.4rem;font-weight:800;color:var(--accent);}
.result-score .sub{color:var(--ink-soft);font-size:.86rem;margin-top:4px;}
.wrong-item, .weak-row{
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--card);
}
.wrong-item .head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.wrong-item .qtext{font-size:.95rem;margin-bottom:8px;}
.wrong-item .count-badge{margin-left:auto;font-family:var(--font-mono);font-size:.72rem;color:var(--wrong);}
.wrong-item .last-pick{font-size:.78rem;color:var(--wrong);margin-bottom:6px;}
.wrong-item .answer-line{font-size:.82rem;color:var(--correct);margin-bottom:6px;}
.wrong-item .explain{margin-top:0;}
.clear-link{background:none;border:none;color:var(--ink-soft);font-size:.76rem;cursor:pointer;text-decoration:underline;padding:0;margin-top:8px;}
.empty-state{text-align:center;color:var(--ink-soft);padding:40px 16px;font-size:.9rem;}
.weak-row .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;align-items:baseline;}

<div class="app-shell" id="app"></div>
<script>
const DATA = [
{s:1,t:`운영체제 개요`,q:`하나의 컴퓨터에 여러 개의 CPU를 설치하여 프로그램을 처리하는 방식은?`,c:[`다중 처리 시스템`,`임베디드 시스템`,`시분할 시스템`,`분산 처리 시스템`],a:0,e:`다중 처리 시스템(Multi-Processing System)은 한 컴퓨터에 여러 CPU를 설치해 처리하는 방식이다.`},
{s:1,t:`운영체제 개요`,q:`마이크로프로세서에 특정 기능을 수행하는 응용 프로그램을 탑재하여 컴퓨터 기능을 수행하는 시스템은?`,c:[`임베디드 시스템`,`일괄 처리 시스템`,`다중 프로그래밍 시스템`,`실시간 처리 시스템`],a:0,e:`임베디드 시스템은 마이크로프로세서에 특정 응용 프로그램을 탑재하여 동작하는 시스템이다.`},
{s:1,t:`운영체제 개요`,q:`운영체제의 목적으로 보기 어려운 것은?`,c:[`처리 능력(Throughput) 향상`,`반환 시간(Turn Around Time) 단축`,`사용 가능도(Availability) 향상`,`프로그램 소스 코드 크기 최소화`],a:3,e:`운영체제의 4대 목적은 처리능력 향상, 반환시간 단축, 사용가능도 향상, 신뢰도 향상이다. 소스 코드 크기와는 무관하다.`},
{s:1,t:`운영체제 개요`,q:`실시간 처리 시스템에 대한 설명으로 옳은 것은?`,c:[`처리할 데이터가 생겨날 때마다 바로 처리하는 방식이다.`,`한 개의 CPU로 여러 프로그램을 동시에 처리하는 방식이다.`,`지역적으로 분산된 여러 컴퓨터를 연결하여 작업을 분담하는 방식이다.`,`한 컴퓨터에 여러 CPU를 설치하여 처리하는 방식이다.`],a:0,e:`실시간 처리 시스템은 데이터가 발생할 때마다 즉시 처리하는 방식이다.`},
{s:1,t:`프로세스`,q:`프로세스(Process)에 대한 설명으로 옳지 않은 것은?`,c:[`PCB를 가진 프로그램이다.`,`프로세서가 할당되는 실체이다.`,`비동기적 행위를 일으키는 주체이다.`,`보조기억장치에 영구 저장된 정적인 프로그램이다.`],a:3,e:`프로세스는 주기억장치에 저장되어 실행 중인 동적인 프로그램을 의미한다.`},
{s:1,t:`프로세스`,q:`프로세스 상태 중 '입출력 처리가 완료될 때까지 대기하고 있는 상태'는?`,c:[`준비(Ready)`,`실행(Run)`,`대기(Wait)`,`종료(Terminated)`],a:2,e:`대기(Wait/Block) 상태는 입출력 처리가 끝날 때까지 기다리는 상태이다.`},
{s:1,t:`프로세스`,q:`프로세스가 프로세서를 할당받아 실행되고 있는 상태는?`,c:[`제출(Submit)`,`접수(Hold)`,`실행(Run)`,`보류`],a:2,e:`실행(Run) 상태는 프로세서를 할당받아 실제로 실행되는 상태이다.`},
{s:1,t:`스케줄링`,q:`준비상태 큐에 도착한 순서대로 CPU를 할당하는 스케줄링 기법은?`,c:[`FCFS`,`SJF`,`RR`,`SSTF`],a:0,e:`FCFS(FIFO)는 도착한 순서대로 CPU를 할당하는 비선점 스케줄링 기법이다.`},
{s:1,t:`스케줄링`,q:`시분할 시스템을 위해 고안되었으며, FCFS를 선점형으로 변형한 스케줄링 기법은?`,c:[`SJF`,`RR(Round Robin)`,`FCFS`,`SSTF`],a:1,e:`RR은 시분할 시스템을 위해 FCFS를 선점형으로 변형한 기법이다.`},
{s:1,t:`스케줄링`,q:`준비상태 큐에 있는 프로세스 중 실행 시간이 가장 짧은 프로세스에게 먼저 CPU를 할당하는 기법은?`,c:[`SJF`,`FCFS`,`RR`,`FIFO`],a:0,e:`SJF(Shortest Job First)는 실행 시간이 가장 짧은 프로세스를 우선 처리한다.`},
{s:1,t:`교착상태`,q:`교착상태(Deadlock) 발생의 필요충분조건이 아닌 것은?`,c:[`상호 배제`,`점유와 대기`,`선점(Preemption)`,`환형 대기`],a:2,e:`교착상태의 4대 조건은 상호배제, 점유와대기, 비선점, 환형대기이다. 선점이 가능하면 교착상태가 발생하지 않는다.`},
{s:1,t:`교착상태`,q:`'하나의 자원을 점유하고 있으면서 다른 프로세스에 할당된 자원을 추가로 점유하기 위해 대기하는' 교착상태 조건은?`,c:[`상호 배제`,`점유와 대기`,`비선점`,`환형 대기`],a:1,e:`점유와 대기(Hold and Wait) 조건에 대한 설명이다.`},
{s:1,t:`기억장치 관리`,q:`기억장치 배치 전략 중 단편화를 가장 작게 남기는 분할 영역에 배치하는 방식은?`,c:[`최초 적합(First Fit)`,`최적 적합(Best Fit)`,`최악 적합(Worst Fit)`,`순환 적합`],a:1,e:`최적 적합(Best Fit)은 단편화를 가장 작게 남기는 영역에 배치한다.`},
{s:1,t:`기억장치 관리`,q:`첫 번째로 찾아지는 분할 영역에 프로그램을 배치하는 기억장치 배치전략은?`,c:[`최초 적합`,`최적 적합`,`최악 적합`,`임의 적합`],a:0,e:`최초 적합(First Fit)은 첫 번째로 발견되는 분할 영역에 배치한다.`},
{s:1,t:`가상기억장치`,q:`프로그램과 주기억장치의 영역을 동일한 크기로 나누어 적재시켜 실행하는 기법으로, 내부 단편화가 발생할 수 있는 것은?`,c:[`페이징 기법`,`세그먼테이션 기법`,`스와핑`,`오버레이`],a:0,e:`페이징 기법은 동일한 크기의 페이지 단위로 나누어 적재하며 내부 단편화가 발생할 수 있다.`},
{s:1,t:`가상기억장치`,q:`프로그램을 다양한 크기의 논리적 단위로 나누어 실행시키며 외부 단편화가 발생할 수 있는 기법은?`,c:[`페이징 기법`,`세그먼테이션 기법`,`버디 시스템`,`압축`],a:1,e:`세그먼테이션 기법은 논리적 크기(세그먼트) 단위로 나누며 외부 단편화가 발생할 수 있다.`},
{s:1,t:`가상기억장치`,q:`최근에 가장 오랫동안 사용되지 않은 페이지를 교체하는 페이지 교체 알고리즘은?`,c:[`FIFO`,`LRU`,`NUR`,`OPT`],a:1,e:`LRU(Least Recently Used)는 가장 오랫동안 사용되지 않은 페이지를 교체한다.`},
{s:1,t:`가상기억장치`,q:`가장 먼저 들어와서 가장 오래 있었던 페이지를 교체하는 알고리즘은?`,c:[`FIFO`,`LRU`,`LFU`,`NUR`],a:0,e:`FIFO는 가장 먼저 들어온 페이지를 먼저 교체한다.`},
{s:1,t:`가상기억장치`,q:`참조 비트와 변형 비트를 사용하여 최근에 사용하지 않은 페이지를 교체하는 알고리즘은?`,c:[`NUR`,`LRU`,`FIFO`,`SJF`],a:0,e:`NUR(Not Used Recently)은 참조 비트와 변형 비트를 이용해 교체 대상을 정한다.`},
{s:1,t:`디스크 관리`,q:`초기 헤드 위치에서 가장 먼저 들어온 요청 순서대로 서비스하는 디스크 스케줄링 기법은?`,c:[`FCFS`,`SSTF`,`SCAN`,`LOOK`],a:0,e:`FCFS 디스크 스케줄링은 요청이 들어온 순서대로 헤드를 이동시킨다.`},
{s:1,t:`디스크 관리`,q:`탐색 거리가 가장 짧은 트랙에 대한 요청을 먼저 서비스하는 디스크 스케줄링 기법은?`,c:[`FCFS`,`SSTF`,`C-SCAN`,`N-Step SCAN`],a:1,e:`SSTF(Shortest Seek Time First)는 현재 위치에서 가장 가까운 트랙 요청을 우선 처리한다.`},
{s:1,t:`파일 시스템`,q:`레코드를 임의의 물리적 저장공간에 기록하며, 해싱 함수로 물리적 상대주소를 계산하는 파일 구조는?`,c:[`순차 파일`,`직접 파일(Direct File)`,`색인 순차 파일`,`다중 리스트 파일`],a:1,e:`직접 파일은 해싱 함수를 이용해 물리적 상대주소를 계산하여 레코드를 기록한다.`},
{s:1,t:`파일 시스템`,q:`중앙에 마스터 파일 디렉터리가 있고 그 아래에 사용자별 파일 디렉터리가 있는 구조는?`,c:[`1단계 디렉터리`,`2단계 디렉터리`,`트리 구조 디렉터리`,`비주기 그래프 디렉터리`],a:1,e:`2단계 디렉터리는 마스터 파일 디렉터리 아래 사용자별 디렉터리를 두는 구조이다.`},
{s:1,t:`UNIX`,q:`UNIX의 특징으로 옳지 않은 것은?`,c:[`대부분 C 언어로 작성되어 이식성이 높다.`,`다중 사용자, 다중 작업을 지원한다.`,`트리 구조의 파일 시스템을 갖는다.`,`GUI 환경만을 지원하는 폐쇄형 운영체제이다.`],a:3,e:`UNIX는 이식성이 높고 다중 사용자·다중 작업을 지원하는 개방형 운영체제이다.`},
{s:1,t:`UNIX`,q:`UNIX 커널(Kernel)의 기능이 아닌 것은?`,c:[`프로세스 관리`,`기억장치 관리`,`사용자 명령어 해석`,`입·출력 관리`],a:2,e:`사용자 명령어 해석은 쉘(Shell)의 기능이며, 커널은 프로세스·기억장치·파일·입출력을 관리한다.`},
{s:1,t:`UNIX`,q:`사용자의 명령어를 인식하여 프로그램을 호출하고 수행하는 UNIX의 명령어 해석기는?`,c:[`커널(Kernel)`,`쉘(Shell)`,`유틸리티`,`데몬`],a:1,e:`쉘은 사용자와 시스템 간 인터페이스를 담당하는 명령어 해석기이다.`},
{s:1,t:`UNIX`,q:`파일의 소유자를 변경하는 UNIX 명령어는?`,c:[`chmod`,`chown`,`fork`,`exec`],a:1,e:`chown은 파일 소유자를 변경하는 명령어이다. chmod는 보호 모드(허가권)를 설정한다.`},
{s:1,t:`UNIX`,q:`새로운 프로세스를 생성하는 UNIX 명령어는?`,c:[`fork`,`exec`,`cat`,`ls`],a:0,e:`fork는 새로운 프로세스를 생성하며, exec는 새로운 프로세스를 수행한다.`},
{s:1,t:`데이터 통신`,q:`시작 비트와 정지 비트를 붙여서 전송하며 문자 사이의 휴지 시간이 불규칙한 전송 방식은?`,c:[`동기식 전송`,`비동기식 전송`,`병렬 전송`,`전이중 전송`],a:1,e:`비동기식 전송은 시작/정지 비트를 사용하며 문자 간 휴지 시간이 불규칙하다.`},
{s:1,t:`데이터 통신`,q:`수신 측에서 오류가 발생한 비트를 검출한 후 직접 수정할 수 있으며 1비트의 오류만 수정 가능한 코드는?`,c:[`패리티 비트`,`해밍 코드`,`CRC`,`BCD 코드`],a:1,e:`해밍 코드는 오류를 검출하고 1비트 오류를 직접 수정할 수 있는 코드이다.`},
{s:1,t:`OSI·TCP/IP`,q:`OSI 7계층을 물리 계층부터 순서대로 나열한 것은?`,c:[`물리-데이터링크-네트워크-전송-세션-표현-응용`,`물리-네트워크-데이터링크-전송-세션-표현-응용`,`데이터링크-물리-네트워크-전송-표현-세션-응용`,`물리-데이터링크-전송-네트워크-세션-표현-응용`],a:0,e:`OSI 7계층: 물리-데이터링크-네트워크-전송-세션-표현-응용 순서이다.`},
{s:1,t:`OSI·TCP/IP`,q:`개방 시스템들 간의 네트워크 연결을 관리하고 데이터의 교환 및 중계 기능을 담당하는 OSI 계층은?`,c:[`데이터 링크 계층`,`네트워크 계층`,`전송 계층`,`세션 계층`],a:1,e:`네트워크 계층은 개방 시스템 간 연결 관리와 데이터 교환·중계 기능을 담당한다.`},
{s:1,t:`OSI·TCP/IP`,q:`종단 시스템 간에 투명한 데이터 전송을 가능하게 하는 OSI 계층은?`,c:[`네트워크 계층`,`전송 계층`,`세션 계층`,`표현 계층`],a:1,e:`전송 계층은 종단 시스템 간 투명한 데이터 전송을 담당한다.`},
{s:1,t:`OSI·TCP/IP`,q:`TCP/IP 계층 중 TCP, UDP가 속하는 계층은?`,c:[`응용 계층`,`전송 계층`,`인터넷 계층`,`네트워크 액세스 계층`],a:1,e:`TCP, UDP는 TCP/IP의 전송 계층 프로토콜이다.`},
{s:1,t:`OSI·TCP/IP`,q:`TCP/IP의 인터넷 계층에 속하는 프로토콜이 아닌 것은?`,c:[`IP`,`ICMP`,`ARP`,`SMTP`],a:3,e:`SMTP는 응용 계층 프로토콜이다. IP, ICMP, ARP는 인터넷 계층 프로토콜이다.`},
{s:1,t:`OSI·TCP/IP`,q:`IPv6 주소에 대한 설명으로 옳지 않은 것은?`,c:[`16비트씩 8부분, 총 128비트로 구성된다.`,`각 부분을 16진수로 표현하고 콜론(:)으로 구분한다.`,`인증성, 기밀성, 데이터 무결성을 지원한다.`,`IPv4보다 주소 공간이 좁아 확장성이 낮다.`],a:3,e:`IPv6은 128비트 주소체계로 IPv4보다 주소 공간이 훨씬 넓고 확장성이 뛰어나다.`},
{s:1,t:`OSI·TCP/IP`,q:`라우팅 프로토콜 중 링크 상태(Link State) 방식에 해당하는 것은?`,c:[`RIP`,`OSPF`,`EGP`,`BGP`],a:1,e:`OSPF는 링크 상태 방식이며, RIP·EIGRP·BGP는 거리 벡터 계열이다.`},
{s:1,t:`OSI·TCP/IP`,q:`메시지를 일정한 길이의 패킷으로 잘라 전송하며 장애 발생 시 다른 경로로 우회할 수 있는 교환 방식은?`,c:[`회선 교환 방식`,`패킷 교환 방식`,`메시지 교환 방식`,`셀 교환 방식`],a:1,e:`패킷 교환 방식은 패킷 단위로 전송하며 장애 시 다른 경로로 우회할 수 있다.`},
{s:1,t:`OSI·TCP/IP`,q:`100BASE-T라고 불리며 UTP 케이블로 100Mbps 속도를 내는 이더넷 규격은?`,c:[`표준 이더넷`,`고속 이더넷`,`기가비트 이더넷`,`토큰링`],a:1,e:`고속 이더넷(100BASE-T)은 CSMA/CD와 UTP 케이블로 100Mbps 전송을 지원한다.`},
{s:1,t:`SW공학 기초`,q:`소프트웨어 공학의 기본 원칙으로 옳지 않은 것은?`,c:[`현대적인 프로그래밍 기술을 계속적으로 적용한다.`,`소프트웨어 품질을 지속적으로 검증한다.`,`개발 관련 기록을 명확히 유지한다.`,`문서화 없이 개발 속도만을 최우선으로 한다.`],a:3,e:`소프트웨어 공학은 지속적인 품질 검증과 명확한 기록 유지를 기본 원칙으로 한다.`},
{s:1,t:`개발 방법론`,q:`보헴이 제시한 고전적 생명주기 모형으로, 이전 단계로 돌아갈 수 없다는 전제하에 순차적으로 진행하는 모형은?`,c:[`폭포수 모형`,`나선형 모형`,`프로토타입 모형`,`애자일 모형`],a:0,e:`폭포수 모형은 보헴이 제시한 고전적 모형으로 각 단계를 순차적으로 확실히 매듭짓고 진행한다.`},
{s:1,t:`개발 방법론`,q:`'계획 수립 → 위험 분석 → 개발 및 검증 → 고객 평가' 과정을 반복하며 점진적으로 완벽한 소프트웨어를 개발하는 모형은?`,c:[`폭포수 모형`,`나선형 모형`,`반복적 모형`,`V모형`],a:1,e:`나선형 모형은 해당 4단계를 반복하며 점진적으로 완벽한 소프트웨어를 개발한다.`},
{s:1,t:`개발 방법론`,q:`애자일 개발의 4가지 핵심 가치로 옳지 않은 것은?`,c:[`프로세스와 도구보다 개인과 상호작용`,`방대한 문서보다 실행되는 SW`,`계약 협상보다 고객과의 협업`,`변화 대응보다 계획 준수`],a:3,e:`애자일은 계획 준수보다 변화에 대한 대응에 더 가치를 둔다.`},
{s:1,t:`개발 방법론`,q:`XP(eXtreme Programming)의 핵심 가치가 아닌 것은?`,c:[`의사소통(Communication)`,`단순성(Simplicity)`,`계획성(Planning)`,`피드백(Feedback)`],a:2,e:`XP의 핵심 가치는 의사소통, 단순성, 용기, 존중, 피드백이다.`},
{s:1,t:`UML`,q:`시스템 개발자와 고객 간 의사소통이 원활하게 이루어지도록 표준화한 대표적인 객체지향 모델링 언어는?`,c:[`UML`,`ERD`,`DFD`,`BPMN`],a:0,e:`UML은 표준화된 대표적인 객체지향 모델링 언어이다.`},
{s:1,t:`UML`,q:`UML의 구성 요소가 아닌 것은?`,c:[`사물(Things)`,`관계(Relationships)`,`다이어그램(Diagram)`,`알고리즘(Algorithm)`],a:3,e:`UML의 구성 요소는 사물, 관계, 다이어그램이다.`},
{s:1,t:`UML`,q:`UML 관계 중 필요에 의해 서로에게 짧은 시간 동안만 영향을 주는 관계는?`,c:[`일반화(Generalization)`,`의존(Dependency)`,`실체화(Realization)`,`연관(Association)`],a:1,e:`의존 관계는 짧은 시간 동안만 연관을 유지하며 영향을 주는 관계이다.`},
{s:1,t:`UML`,q:`소프트웨어 아키텍처 뷰의 종류가 아닌 것은?`,c:[`유스케이스 뷰`,`논리적 뷰`,`프로세스 뷰`,`알고리즘 뷰`],a:3,e:`소프트웨어 아키텍처 뷰에는 유스케이스, 논리적, 구현, 프로세스, 배포 뷰가 있다.`},
{s:1,t:`구조적 분석`,q:`자료 흐름도(DFD)에서 원(circle) 기호가 나타내는 구성 요소는?`,c:[`프로세스(Process)`,`자료 흐름(Data Flow)`,`자료 저장소(Data Store)`,`단말(Terminator)`],a:0,e:`원 기호는 자료 흐름도에서 프로세스를 나타낸다.`},
{s:1,t:`구조적 분석`,q:`자료 사전 표기 기호 중 '반복'을 의미하는 기호는?`,c:[`= (정의)`,`+ (연결)`,`{ } (반복)`,`( ) (생략)`],a:2,e:`중괄호 { }는 자료 사전에서 반복을 의미한다.`},
{s:1,t:`아키텍처 패턴`,q:`각 단계를 필터 컴포넌트로 캡슐화하여 파이프를 통해 데이터를 전송하는 소프트웨어 아키텍처 패턴은?`,c:[`파이프-필터 패턴`,`MVC 패턴`,`클라이언트-서버 패턴`,`계층 패턴`],a:0,e:`파이프-필터 패턴은 필터 컴포넌트를 파이프로 연결해 데이터를 전달하는 패턴이다.`},
{s:1,t:`객체지향 기본`,q:`이미 정의된 상위 클래스의 모든 속성과 연산을 하위 클래스가 물려받는 객체지향 개념은?`,c:[`캡슐화`,`상속(Inheritance)`,`다형성`,`추상화`],a:1,e:`상속은 상위 클래스의 속성과 연산을 하위 클래스가 물려받는 개념이다.`},
{s:1,t:`객체지향 기본`,q:`공통된 속성과 연산을 갖는 객체의 집합이며, 이에 속한 각 객체를 인스턴스라 부르는 것은?`,c:[`클래스`,`메소드`,`패키지`,`모듈`],a:0,e:`클래스는 공통 속성·연산을 갖는 객체의 집합이며, 그 객체를 인스턴스라 한다.`},
{s:1,t:`객체지향 기본`,q:`구체 클래스에서 구현하려는 기능들의 공통점만을 모아 추상화한 것으로 인스턴스 생성이 불가능한 것은?`,c:[`인터페이스`,`추상 클래스`,`익명 클래스`,`내부 클래스`],a:1,e:`추상 클래스는 공통 기능만 추상화한 클래스로 인스턴스 생성이 불가능하다.`},
{s:1,t:`객체지향 기본`,q:`데이터와 이를 처리하는 함수를 하나로 묶어, 외부 모듈 변경에 따른 파급 효과를 줄이는 객체지향 개념은?`,c:[`캡슐화(Encapsulation)`,`상속성`,`다형성`,`연관성`],a:0,e:`캡슐화는 데이터와 함수를 묶어 파급 효과를 줄이고 재사용을 용이하게 한다.`},
{s:1,t:`럼바우 분석기법`,q:`럼바우의 분석 기법 중 상태 다이어그램을 이용하여 객체들 간의 동적인 행위를 표현하는 모델링은?`,c:[`객체(Object) 모델링`,`동적(Dynamic) 모델링`,`기능(Functional) 모델링`,`정적 모델링`],a:1,e:`동적 모델링은 상태 다이어그램으로 객체 간 동적 행위를 표현한다.`},
{s:1,t:`럼바우 분석기법`,q:`럼바우의 분석 기법 중 자료 흐름도를 이용하여 프로세스 간 처리 과정을 표현하는 모델링은?`,c:[`객체 모델링`,`동적 모델링`,`기능 모델링`,`구조 모델링`],a:2,e:`기능 모델링은 자료 흐름도로 프로세스 간 처리 과정을 표현한다.`},
{s:1,t:`디자인 패턴`,q:`객체의 생성 과정과 표현 방법을 분리하여 건축하듯 조합해 객체를 생성하는 생성 패턴은?`,c:[`빌더(Builder)`,`싱글톤(Singleton)`,`프로토타입(Prototype)`,`팩토리 메소드`],a:0,e:`빌더 패턴은 객체를 건축하듯 조합하여 생성하며 생성 과정과 표현을 분리한다.`},
{s:1,t:`디자인 패턴`,q:`원본 객체를 복제하는 방법으로 객체를 생성하며, 객체 생성 비용이 큰 경우 주로 이용하는 패턴은?`,c:[`빌더`,`싱글톤`,`프로토타입(Prototype)`,`어댑터`],a:2,e:`프로토타입 패턴은 원본 객체를 복제하는 방식으로 객체를 생성한다.`},
{s:1,t:`디자인 패턴`,q:`생성된 객체를 어디서든 참조할 수 있지만 여러 프로세스가 동시에 참조할 수는 없어 메모리 낭비를 최소화하는 패턴은?`,c:[`싱글톤(Singleton)`,`빌더`,`프로토타입`,`옵서버`],a:0,e:`싱글톤 패턴은 객체를 하나만 생성해 어디서든 참조하도록 하는 패턴이다.`},
{s:1,t:`디자인 패턴`,q:`객체에 부가적인 기능을 추가하기 위해 다른 객체들을 덧붙이는 방식으로 구현하는 구조 패턴은?`,c:[`어댑터(Adapter)`,`데코레이터(Decorator)`,`프록시(Proxy)`,`브리지`],a:1,e:`데코레이터 패턴은 객체에 다른 객체를 덧붙여 기능을 확장하는 구조 패턴이다.`},
{s:1,t:`테스트`,q:`원시 코드의 논리적인 모든 경로를 테스트하여 테스트 케이스를 설계하는 기법은?`,c:[`블랙박스 테스트`,`화이트박스 테스트`,`회귀 테스트`,`알파 테스트`],a:1,e:`화이트박스 테스트는 원시 코드의 논리적 경로를 모두 테스트하는 기법이다.`},
{s:1,t:`테스트`,q:`화이트박스 테스트 중 프로그램의 반복(Loop) 구조에 초점을 맞춰 실시하는 기법은?`,c:[`기초 경로 검사`,`루프 검사`,`조건 검사`,`데이터 흐름 검사`],a:1,e:`루프 검사는 반복 구조에 초점을 맞춘 화이트박스 테스트 기법이다.`},
{s:1,t:`테스트`,q:`화이트박스 테스트의 종류가 아닌 것은?`,c:[`기초 경로 검사`,`루프 검사`,`동치 분할 검사`,`데이터 흐름 검사`],a:2,e:`동치 분할 검사는 블랙박스 테스트 기법이다.`},
{s:1,t:`테스트`,q:`블랙박스 테스트 기법이 아닌 것은?`,c:[`동치 분할 검사`,`경계값 분석`,`기초 경로 검사`,`원인-효과 그래프 검사`],a:2,e:`기초 경로 검사는 화이트박스 테스트 기법이다.`},
{s:1,t:`테스트`,q:`소프트웨어 테스트의 일반적인 순서로 옳은 것은?`,c:[`단위 테스트 → 통합 테스트 → 시스템 테스트 → 인수 테스트`,`시스템 테스트 → 단위 테스트 → 통합 테스트 → 인수 테스트`,`통합 테스트 → 단위 테스트 → 인수 테스트 → 시스템 테스트`,`인수 테스트 → 시스템 테스트 → 통합 테스트 → 단위 테스트`],a:0,e:`테스트는 단위 → 통합 → 시스템 → 인수 테스트 순서로 진행된다.`},
{s:1,t:`테스트`,q:`모듈이나 컴포넌트 자체에 초점을 맞춰 수행하는 테스트는?`,c:[`단위 테스트`,`통합 테스트`,`시스템 테스트`,`인수 테스트`],a:0,e:`단위 테스트는 모듈·컴포넌트 자체에 초점을 맞춘 테스트이다.`},
{s:1,t:`테스트`,q:`단위 테스트가 끝난 모듈을 통합하는 과정에서 발생하는 오류를 찾는 테스트 기법의 종류가 아닌 것은?`,c:[`하향식 통합 테스트`,`상향식 통합 테스트`,`혼합식 통합 테스트`,`회귀 통합 테스트`],a:3,e:`통합 테스트의 종류는 하향식, 상향식, 혼합식 통합 테스트이다.`},
{s:1,t:`사용자 인터페이스`,q:`사용자의 말이나 행동으로 기기를 조작하는 인터페이스는?`,c:[`CLI`,`GUI`,`NUI`,`VUI`],a:2,e:`NUI(Natural User Interface)는 사용자의 말이나 행동으로 기기를 조작하는 인터페이스이다.`},
{s:1,t:`사용자 인터페이스`,q:`아이콘이나 메뉴를 마우스로 선택하여 작업을 수행하는 그래픽 환경의 인터페이스는?`,c:[`CLI`,`GUI`,`NUI`,`VUI`],a:1,e:`GUI(Graphical User Interface)는 아이콘·메뉴를 마우스로 선택해 조작하는 인터페이스이다.`},
{s:1,t:`형상관리·빌드`,q:`소프트웨어의 변경 사항을 관리하기 위해 개발된 일련의 활동을 의미하는 것은?`,c:[`형상 관리(Configuration Management)`,`형상 감사`,`베이스라인`,`릴리즈 관리`],a:0,e:`형상 관리는 소스 코드, 설계서 등 변경 사항을 체계적으로 관리하는 활동이다.`},
{s:1,t:`형상관리·빌드`,q:`빌드를 포함하여 테스트 및 배포를 자동화하는 도구가 아닌 것은?`,c:[`Ant`,`Maven`,`Gradle`,`Git`],a:3,e:`Git은 형상관리(버전관리) 도구이며, Ant·Maven·Gradle·Jenkins가 빌드 자동화 도구이다.`},
{s:2,t:`C언어 기초`,q:`C언어에서 정수형 int 자료형의 일반적인 크기는?`,c:[`1Byte`,`2Byte`,`4Byte`,`8Byte`],a:2,e:`int는 일반적으로 4Byte 크기를 갖는다.`},
{s:2,t:`C언어 기초`,q:`C언어에서 실수형 double 자료형의 크기는?`,c:[`2Byte`,`4Byte`,`8Byte`,`16Byte`],a:2,e:`double은 8Byte, float는 4Byte 크기를 갖는다.`},
{s:2,t:`C언어 기초`,q:`변수명 작성 규칙으로 옳지 않은 것은?`,c:[`첫 글자로 숫자는 올 수 없다.`,`공백이나 특수문자를 사용할 수 없다.`,`예약어를 변수명으로 사용할 수 없다.`,`첫 글자는 반드시 대문자여야 한다.`],a:3,e:`변수명 첫 글자가 반드시 대문자여야 한다는 규칙은 없다.`},
{s:2,t:`C언어 기초`,q:`C언어에서 상수를 만들 때 사용하는 예약어로 옳은 것은?`,c:[`var, let`,`const, #define`,`static, extern`,`auto, register`],a:1,e:`C언어에서 상수는 const 또는 #define 예약어로 만든다.`},
{s:2,t:`C언어 기초`,q:`함수가 종료된 뒤에도 값이 소멸되지 않는, 변수나 함수를 참조하기 위한 변수는?`,c:[`지역 변수`,`외부 변수`,`매개 변수`,`임시 변수`],a:1,e:`외부 변수는 함수 종료 후에도 값이 소멸되지 않는다.`},
{s:2,t:`연산자`,q:`C언어에서 나머지 연산자 %는 어떤 자료형에서만 연산이 가능한가?`,c:[`정수형`,`실수형`,`문자형`,`모든 자료형`],a:0,e:`나머지 연산자 %는 정수형에서만 사용 가능하며 실수에 사용하면 오류가 발생한다.`},
{s:2,t:`연산자`,q:`변수 뒤에 증감 연산자가 와서, 먼저 변수를 연산에 사용한 후 값을 증감시키는 방식은?`,c:[`전치(prefix)`,`후치(postfix)`,`단항`,`이항`],a:1,e:`후치는 변수를 먼저 연산에 사용한 후 값을 증감시키는 방식이다(a++, a--).`},
{s:2,t:`연산자`,q:`관계 연산자 중 '같지 않다'를 의미하는 것은?`,c:[`==`,`!=`,`>=`,`<=`],a:1,e:`!=는 같지 않다를 의미하는 관계 연산자이다.`},
{s:2,t:`연산자`,q:`비트 연산자 중 두 비트가 같으면 0, 다르면 1이 되는 연산자는?`,c:[`& (and)`,`| (or)`,`^ (xor)`,`~ (not)`],a:2,e:`^(xor)는 두 비트가 같으면 0, 다르면 1이 된다.`},
{s:2,t:`연산자`,q:`논리 연산자 중 하나라도 참이면 참이 되는 연산자는?`,c:[`! (not)`,`&& (and)`,`|| (or)`,`^ (xor)`],a:2,e:`||(or)는 피연산자 중 하나라도 참이면 참이 된다.`},
{s:2,t:`연산자`,q:`'a가 b보다 작으면 mx에 b를, 그렇지 않으면 a를 저장'하는 식 mx = a < b ? b : a; 에서 사용된 연산자는?`,c:[`관계 연산자`,`조건 연산자(삼항 연산자)`,`비트 연산자`,`대입 연산자`],a:1,e:`?: 는 조건에 따라 다른 값을 반환하는 삼항(조건) 연산자이다.`},
{s:2,t:`연산자`,q:`C언어 연산자 우선순위에서 가장 먼저 계산되는 것은?`,c:[`대입 연산자`,`산술 연산자`,`단항 연산자`,`논리 연산자`],a:2,e:`단항 연산자(!, ~, ++, --, sizeof)가 산술·관계·논리·대입 연산자보다 우선순위가 높다.`},
{s:2,t:`표준 입출력`,q:`키보드로 입력받은 값을 변수에 저장하는 C언어 함수는?`,c:[`printf( )`,`scanf( )`,`puts( )`,`gets( )`],a:1,e:`scanf( )는 키보드로 입력받아 변수에 저장하는 함수이다.`},
{s:2,t:`표준 입출력`,q:`정수형 8진수를 입·출력하기 위해 지정하는 서식 문자는?`,c:[`%d`,`%o`,`%x`,`%c`],a:1,e:`%o는 8진수, %x는 16진수, %d는 10진수 정수를 위한 서식 문자이다.`},
{s:2,t:`표준 입출력`,q:`문자열을 입·출력하기 위해 지정하는 서식 문자는?`,c:[`%c`,`%s`,`%f`,`%d`],a:1,e:`%s는 문자열을 입·출력하기 위한 서식 문자이다.`},
{s:2,t:`표준 입출력`,q:`제어 문자 중 커서를 다음 줄의 처음으로 이동시키는 것은?`,c:[`개행 문자(줄바꿈)`,`탭 문자(간격 띄움)`,`널 문자(문자열 종료)`,`벨 소리 출력 문자`],a:0,e:`개행 문자는 커서를 다음 줄 앞으로 이동시킨다.`},
{s:2,t:`표준 입출력`,q:`Java에서 값을 출력한 후 커서를 다음 줄의 처음으로 옮기는 메소드는?`,c:[`print( )`,`printf( )`,`println( )`,`write( )`],a:2,e:`println( )은 출력 후 커서를 다음 줄 처음으로 옮긴다.`},
{s:2,t:`표준 입출력`,q:`키보드로 한 문자를 입력받아 변수에 저장하는 C언어 함수는?`,c:[`getchar( )`,`putchar( )`,`gets( )`,`puts( )`],a:0,e:`getchar( )는 키보드로 한 문자를 입력받아 저장하는 함수이다.`},
{s:2,t:`표준 입출력`,q:`파일로부터 한 문자를 입력받아 변수에 저장하는 함수는?`,c:[`fscanf( )`,`fgetc( )`,`fgets( )`,`fprintf( )`],a:1,e:`fgetc( )는 파일로부터 한 문자를 입력받는 함수이다.`},
{s:2,t:`제어문`,q:`조건이 한 개일 때 사용하며, 조건이 참일 때만 실행할 문장이 있는 제어문은?`,c:[`단순 if문`,`switch문`,`for문`,`while문`],a:0,e:`단순 if문은 조건이 한 개이며 참일 때만 실행하는 제어문이다.`},
{s:2,t:`제어문`,q:`switch문에서 break문이 생략되면 어떻게 되는가?`,c:[`오류가 발생한다.`,`수식과 일치하는 곳부터 switch문이 끝날 때까지 모든 문장이 실행된다.`,`해당 case만 실행되고 종료된다.`,`default만 실행된다.`],a:1,e:`break가 생략되면 일치하는 case부터 switch문이 끝날 때까지 모든 문장이 실행된다.`},
{s:2,t:`제어문`,q:`초기값, 최종값, 증가값을 지정하여 정해진 횟수만큼 반복하는 제어문은?`,c:[`if문`,`switch문`,`for문`,`goto문`],a:2,e:`for문은 초기값·최종값·증가값을 지정해 정해진 횟수만큼 반복한다.`},
{s:2,t:`제어문`,q:`조건이 참인 동안 문장을 반복 수행하며, 조건을 먼저 판단한 후 실행 여부를 결정하는 제어문은?`,c:[`while문`,`do~while문`,`for문`,`switch문`],a:0,e:`while문은 조건을 먼저 판단한 후 실행 여부를 결정한다.`},
{s:2,t:`제어문`,q:`실행할 문장을 무조건 한 번 실행한 다음 조건을 판단하여 반복 여부를 결정하는 제어문은?`,c:[`while문`,`do~while문`,`if문`,`for문`],a:1,e:`do~while문은 한 번 실행 후 조건을 판단하여 반복 여부를 결정한다.`},
{s:2,t:`배열과 포인터`,q:`char a[3] = {'A','B','C'};와 같이 선언된 배열의 형태는?`,c:[`1차원 배열`,`2차원 배열`,`3차원 배열`,`포인터 배열`],a:0,e:`요소가 일직선으로 나열된 1차원 배열이다.`},
{s:2,t:`배열과 포인터`,q:`포인터 변수를 선언할 때 변수명 앞에 붙이는 연산자는?`,c:[`& (번지 연산자)`,`* (간접 연산자)`,`% (나머지 연산자)`,`# (전처리기)`],a:1,e:`포인터 변수는 변수명 앞에 간접 연산자 *를 붙여 선언한다.`},
{s:2,t:`배열과 포인터`,q:`변수의 주소를 알아내기 위해 변수 앞에 붙이는 연산자는?`,c:[`*`,`&`,`%`,`~`],a:1,e:`&는 변수의 주소를 알아내는 번지 연산자이다.`},
{s:2,t:`배열과 포인터`,q:`int a=50; int *b; b=&a; *b=*b+20; 실행 후 a의 값은?`,c:[`50`,`20`,`70`,`30`],a:2,e:`b는 a의 주소를 가리키므로 *b=*b+20 은 a=a+20이 되어 a는 70이 된다.`},
{s:2,t:`배열과 포인터`,q:`C언어에서 배열에 문자열을 저장할 때 문자열의 끝에 자동으로 삽입되는 것은?`,c:[`공백 문자`,`널 문자('\\0')`,`탭 문자`,`개행 문자`],a:1,e:`문자열 끝에는 문자열의 끝을 알리는 널 문자('\\0')가 자동으로 삽입된다.`},
{s:2,t:`배열과 포인터`,q:`배열의 위치를 나타내는 첨자를 생략하고 배열의 대표명만 지정하면 무엇을 의미하는가?`,c:[`배열의 마지막 요소 주소`,`배열의 첫 번째 요소 주소`,`배열 전체 크기`,`배열의 임의 요소 주소`],a:1,e:`배열의 대표명만 지정하면 배열의 첫 번째 요소(a[0])의 주소를 의미한다.`},
{s:2,t:`함수`,q:`모든 C 프로그램이 반드시 시작되는 함수는?`,c:[`start( )`,`main( )`,`init( )`,`run( )`],a:1,e:`모든 C 프로그램은 반드시 main( ) 함수에서 시작한다.`},
{s:2,t:`Python`,q:`Python에서 if나 for와 같은 코드 블록을 구분할 때 사용하는 것은?`,c:[`중괄호 { }`,`콜론(:)과 들여쓰기`,`세미콜론(;)`,`괄호( )`],a:1,e:`Python은 콜론(:)과 들여쓰기로 코드 블록을 구분한다.`},
{s:2,t:`Python`,q:`Python의 input( ) 함수로 입력받은 값은 어떤 자료형으로 취급되는가?`,c:[`정수형`,`실수형`,`문자열`,`불리언`],a:2,e:`input( )으로 입력받은 값은 항상 문자열로 취급된다.`},
{s:2,t:`Python`,q:`print(82, 24, sep='-', end=',')의 출력 결과는?`,c:[`82,24-`,`82-24,`,`82 24,`,`82-24-`],a:1,e:`sep='-'로 82와 24 사이에 -가 들어가고, end=','로 마지막에 ,가 출력되어 82-24,가 된다.`},
{s:2,t:`Python`,q:`a = list(range(1, 15, 3))의 결과로 옳은 것은?`,c:[`[1,4,7,10,13]`,`[1,3,5,7,9]`,`[1,2,3,4,5]`,`[1,5,9,13]`],a:0,e:`range(1,15,3)은 1부터 14까지 3씩 증가하는 수열이므로 [1,4,7,10,13]이다.`},
{s:2,t:`Python`,q:`a = ['a','b','c','d','e']일 때 a[1:3]의 결과는?`,c:[`['a','b']`,`['b','c']`,`['b','c','d']`,`['c','d']`],a:1,e:`슬라이스 a[1:3]은 인덱스 1부터 2까지, 즉 ['b','c']이다.`},
{s:2,t:`Python`,q:`a = ['a','b','c','d','e']일 때 a[::3]의 결과는?`,c:[`['a','d']`,`['a','b','c']`,`['d','e']`,`['a','c','e']`],a:0,e:`a[::3]은 처음부터 3칸씩 건너뛰므로 ['a','d']이다.`},
{s:2,t:`Python`,q:`Python의 for문에서 range를 사용하지 않고 반복할 때 주로 이용하는 것은?`,c:[`딕셔너리(Dictionary)`,`리스트(List)`,`튜플(Tuple)만 가능`,`집합(Set)만 가능`],a:1,e:`리스트에 저장된 요소들을 순서대로 꺼내며 for문을 반복 수행할 수 있다.`},
{s:2,t:`웹 프로그래밍`,q:`HTML에서 화면을 분할할 때 사용하는 태그는?`,c:[`<div>`,`<frameset>`,`<table>`,`<section>`],a:1,e:`<frameset> 태그는 화면을 분할하고, 분할된 영역에 <frame> 태그로 문서를 지정한다.`},
{s:2,t:`웹 프로그래밍`,q:`HTML <form> 태그의 method 속성값 중 입력받은 데이터를 URL에 첨부하여 전송하는 방식은?`,c:[`get`,`post`,`put`,`send`],a:0,e:`get 방식은 입력 데이터를 URL에 첨부하여 전송한다.`},
{s:2,t:`웹 프로그래밍`,q:`HTML 테이블에서 셀을 만들면서 제목 스타일을 적용하는 태그는?`,c:[`<td>`,`<th>`,`<tr>`,`<thead>`],a:1,e:`<th>는 셀을 만들면서 제목 스타일을 적용하는 태그이다.`},
{s:2,t:`웹 프로그래밍`,q:`CSS 선택자 중 N번째 요소마다 서식을 적용하는 것은?`,c:[`first-child`,`last-child`,`nth-child(N)`,`only-child`],a:2,e:`nth-child(N)은 N번째 요소마다 서식을 적용하는 선택자이다.`},
{s:2,t:`웹 프로그래밍`,q:`JavaScript에서 가장 일반적인 출력 메소드로, 화면에 데이터를 출력하는 것은?`,c:[`console.log( )`,`document.write( )`,`alert( )`,`print( )`],a:1,e:`document.write( )는 인수로 주어진 데이터를 화면에 출력하는 가장 일반적인 메소드이다.`},
{s:2,t:`웹 프로그래밍`,q:`JavaScript 대화상자 중 <확인>과 <취소> 단추가 표시되는 것은?`,c:[`alert( )`,`confirm( )`,`prompt( )`,`print( )`],a:1,e:`confirm( )은 확인/취소 단추가 표시되는 확인 대화상자이다.`},
{s:2,t:`웹 프로그래밍`,q:`JavaScript 배열 메소드 중 배열의 마지막 요소를 제거하는 것은?`,c:[`push( )`,`pop( )`,`shift( )`,`join( )`],a:1,e:`pop( )은 배열의 마지막 요소를 제거하는 메소드이다.`},
{s:2,t:`웹 프로그래밍`,q:`JavaScript 배열 메소드 중 배열의 모든 요소를 하나의 문자열로 변환하는 것은?`,c:[`join( )`,`splice( )`,`shift( )`,`push( )`],a:0,e:`join( )은 배열의 모든 요소를 하나의 문자열로 변환하는 메소드이다.`},
{s:2,t:`객체지향 언어`,q:`메타(META)에서 개발한 JavaScript 프레임워크는?`,c:[`jQuery`,`React`,`Angular`,`Ember`],a:1,e:`React는 메타(구 페이스북)에서 개발한 프레임워크이다.`},
{s:2,t:`객체지향 언어`,q:`구글(Google)에서 개발한 JavaScript 프레임워크는?`,c:[`React`,`Angular`,`Node.js`,`jQuery`],a:1,e:`Angular는 구글에서 개발한 프레임워크이다.`},
{s:2,t:`객체지향 언어`,q:`1세대 객체지향 프로그래밍 언어 중 하나로 순수한 객체지향 언어로 평가받는 것은?`,c:[`C++`,`JAVA`,`Smalltalk`,`Python`],a:2,e:`Smalltalk는 1세대 순수 객체지향 프로그래밍 언어이다.`},
{s:2,t:`객체지향 언어`,q:`객체지향 프로그래밍 언어의 구성 요소 중 데이터(속성)와 이를 처리하기 위한 연산(메소드)을 결합시킨 실체는?`,c:[`객체(Object)`,`클래스(Class)`,`모듈`,`패키지`],a:0,e:`객체는 데이터(속성)와 연산(메소드)을 결합시킨 실체이다.`},
{s:2,t:`객체지향 언어`,q:`귀도 반 로섬이 발표한 대화형 인터프리터 언어는?`,c:[`Java`,`Python`,`PHP`,`Basic`],a:1,e:`Python은 귀도 반 로섬이 발표한 대화형 인터프리터 언어이다.`},
{s:2,t:`객체지향 언어`,q:`Linux, Unix, Windows에서 사용 가능한 서버용 스크립트 언어는?`,c:[`JavaScript`,`PHP`,`Python`,`Shell Script`],a:1,e:`PHP는 다양한 운영체제에서 사용 가능한 서버용 스크립트 언어이다.`},
{s:2,t:`객체지향 언어`,q:`쉘 스크립트에서 사용되는 반복형 제어문이 아닌 것은?`,c:[`for`,`while`,`until`,`case`],a:3,e:`case는 선택형 제어문이다. 반복형에는 for, while, until이 있다.`},
{s:2,t:`결합도·응집도`,q:`모듈 간에 상호 의존하는 정도를 나타내며, 그 값이 약할수록 독립적인 모듈이 되는 것은?`,c:[`응집도(Cohesion)`,`결합도(Coupling)`,`복잡도`,`추상화`],a:1,e:`결합도는 모듈 간 상호 의존 정도로, 값이 약할수록 독립적인 모듈이 된다.`},
{s:2,t:`결합도·응집도`,q:`결합도의 강도를 약한 것부터 강한 순서로 나열한 것으로 옳은 것은?`,c:[`자료 결합도 < 스탬프 결합도 < 제어 결합도 < 공통 결합도 < 내용 결합도`,`내용 결합도 < 공통 결합도 < 제어 결합도 < 스탬프 결합도 < 자료 결합도`,`자료 결합도 < 제어 결합도 < 스탬프 결합도 < 내용 결합도 < 공통 결합도`,`스탬프 결합도 < 자료 결합도 < 공통 결합도 < 제어 결합도 < 내용 결합도`],a:0,e:`결합도는 자료<스탬프<제어<외부<공통<내용 순으로 강해진다.`},
{s:2,t:`결합도·응집도`,q:`서로 다른 모듈 간에 매개변수 또는 인수를 통해 꼭 필요한 자료만을 교환하는 결합도는?`,c:[`자료 결합도`,`스탬프 결합도`,`내용 결합도`,`공통 결합도`],a:0,e:`자료 결합도는 매개변수·인수로 필요한 자료만 교환하는, 가장 약한 결합도이다.`},
{s:2,t:`결합도·응집도`,q:`한 모듈이 다른 모듈의 내부 자료를 직접적으로 참조하는 경우의 결합도는?`,c:[`자료 결합도`,`스탬프 결합도`,`내용 결합도`,`외부 결합도`],a:2,e:`내용 결합도는 다른 모듈의 내부 자료를 직접 참조하는, 가장 강한(나쁜) 결합도이다.`},
{s:2,t:`결합도·응집도`,q:`모듈 안의 요소들이 서로 관련되어 있는 정도를 나타내며, 그 값이 강할수록 좋은 것은?`,c:[`결합도`,`응집도(Cohesion)`,`의존도`,`복잡도`],a:1,e:`응집도는 모듈 내 요소 간 관련 정도로, 값이 강할수록 좋은 설계이다.`},
{s:2,t:`결합도·응집도`,q:`모듈 내부의 모든 기능 요소가 한 가지의 작업만을 수행하는 경우의 응집도는?`,c:[`우연적 응집도`,`논리적 응집도`,`기능적 응집도(Functional Cohesion)`,`시간적 응집도`],a:2,e:`기능적 응집도는 모든 요소가 한 가지 작업만 수행하는, 가장 강한(좋은) 응집도이다.`},
{s:2,t:`결합도·응집도`,q:`일정한 순서에 의해 처리되어야 할 요소들을 하나의 모듈로 구성했으나, 전달 데이터와 반환 데이터 사이에 관련이 없는 응집도는?`,c:[`절차적 응집도`,`순차적 응집도`,`교환적 응집도`,`기능적 응집도`],a:0,e:`절차적 응집도는 순서대로 처리되지만 데이터 간 관련이 없는 응집도이다.`},
{s:2,t:`프레임워크`,q:`재사용 가능한 모듈들을 제공함으로써 예산 절감, 생산성 향상, 품질 보증이 가능해지는 프레임워크의 특성은?`,c:[`모듈화(Modularity)`,`재사용성(Reusability)`,`확장성(Extensibility)`,`제어의 역흐름`],a:1,e:`재사용성은 재사용 가능한 모듈 제공으로 예산 절감·생산성 향상·품질 보증을 가능하게 한다.`},
{s:2,t:`프레임워크`,q:`개발자가 관리하고 통제해야 하는 객체들의 제어를 프레임워크에 넘김으로써 생산성을 향상시키는 특성은?`,c:[`모듈화`,`재사용성`,`제어의 역흐름(Inversion of Control)`,`확장성`],a:2,e:`제어의 역흐름(IoC)은 객체 제어를 프레임워크에 위임해 생산성을 높인다.`},
{s:2,t:`프레임워크`,q:`C++, C#, Java 등에서 예외 처리 기능을 수행하는 명령문은?`,c:[`if~else문`,`try~catch문`,`switch문`,`for~each문`],a:1,e:`try~catch문은 예외 처리를 수행하는 명령문이다.`},
{s:2,t:`프레임워크`,q:`수학 함수(sqrt, pow, abs 등)를 제공하는 C언어 표준 라이브러리는?`,c:[`stdio.h`,`math.h`,`stdlib.h`,`string.h`],a:1,e:`math.h는 sqrt, pow, abs 등 수학 함수를 제공하는 라이브러리이다.`},
{s:2,t:`프레임워크`,q:`자료형 변환, 난수 발생, 메모리 할당 기능(atoi, rand, malloc 등)을 제공하는 C언어 표준 라이브러리는?`,c:[`math.h`,`stdlib.h`,`stdio.h`,`time.h`],a:1,e:`stdlib.h는 atoi, rand, malloc 등 자료형 변환·난수·메모리 할당 기능을 제공한다.`},
{s:2,t:`재사용`,q:`이미 개발된 기능들을 파악하고 재구성하여 새로운 시스템에 최적화시켜 사용하는 작업은?`,c:[`재공학(Reengineering)`,`재사용(Reuse)`,`역공학(Reverse Engineering)`,`형상관리`],a:1,e:`재사용은 이미 개발된 기능을 재구성해 새로운 시스템에 최적화하여 사용하는 작업이다.`},
{s:3,t:`스택과 큐`,q:`자료구조 중 선형 구조에 해당하지 않는 것은?`,c:[`배열`,`스택`,`트리`,`큐`],a:2,e:`트리는 비선형 구조이다. 선형 구조에는 배열, 선형 리스트, 스택, 큐, 데크가 있다.`},
{s:3,t:`스택과 큐`,q:`가장 나중에 삽입된 자료가 가장 먼저 삭제되는 후입선출(LIFO) 방식의 자료 구조는?`,c:[`큐(Queue)`,`스택(Stack)`,`데크(Deque)`,`트리(Tree)`],a:1,e:`스택은 후입선출(LIFO) 방식으로 자료를 처리한다.`},
{s:3,t:`스택과 큐`,q:`스택의 응용 분야가 아닌 것은?`,c:[`함수 호출의 순서 제어`,`인터럽트의 처리`,`선입선출 방식의 작업 스케줄링`,`수식 계산 및 표기법`],a:2,e:`선입선출은 큐의 특징이다. 스택은 함수 호출 제어, 인터럽트 처리, 수식 계산 등에 쓰인다.`},
{s:3,t:`스택과 큐`,q:`스택에서 자료를 입력하는 명령은?`,c:[`POP`,`PUSH`,`PEEK`,`TOP`],a:1,e:`PUSH는 스택에 자료를 입력하는 명령, POP은 출력하는 명령이다.`},
{s:3,t:`스택과 큐`,q:`가장 먼저 삽입된 자료가 가장 먼저 삭제되는 선입선출(FIFO) 방식의 자료 구조는?`,c:[`스택`,`큐(Queue)`,`데크`,`트리`],a:1,e:`큐는 선입선출(FIFO) 방식으로 자료를 처리한다.`},
{s:3,t:`스택과 큐`,q:`삽입과 삭제가 리스트의 양쪽 끝에서 모두 일어날 수 있는 자료 구조는?`,c:[`스택`,`큐`,`데크(Deque)`,`트리`],a:2,e:`데크는 리스트 양쪽 끝에서 삽입·삭제가 모두 가능한 자료 구조이다.`},
{s:3,t:`트리와 그래프`,q:`정점(Node)과 선분(Branch)을 이용하여 사이클을 이루지 않도록 구성한 그래프의 특수한 형태는?`,c:[`트리(Tree)`,`그래프(Graph)`,`리스트`,`네트워크`],a:0,e:`트리는 사이클을 이루지 않는 그래프의 특수한 형태이다.`},
{s:3,t:`트리와 그래프`,q:`트리에서 자식이 하나도 없는 노드, 즉 디그리(차수)가 0인 노드는?`,c:[`루트 노드`,`단말 노드(Terminal Node)`,`내부 노드`,`형제 노드`],a:1,e:`단말 노드(잎 노드)는 자식이 없는, 디그리가 0인 노드이다.`},
{s:3,t:`트리와 그래프`,q:`노드가 n개인 무방향 그래프의 최대 간선 수는?`,c:[`n`,`n(n-1)`,`n(n-1)/2`,`n²`],a:2,e:`무방향 그래프의 최대 간선 수는 n(n-1)/2이다.`},
{s:3,t:`트리와 그래프`,q:`노드가 n개인 방향 그래프의 최대 간선 수는?`,c:[`n(n-1)/2`,`n(n-1)`,`n²`,`2n`],a:1,e:`방향 그래프의 최대 간선 수는 n(n-1)이다.`},
{s:3,t:`트리와 그래프`,q:`이진 트리 운행법 중 Root → Left → Right 순서로 방문하는 방법은?`,c:[`Inorder`,`Preorder`,`Postorder`,`Levelorder`],a:1,e:`Preorder(전위 순회)는 Root → Left → Right 순서로 방문한다.`},
{s:3,t:`트리와 그래프`,q:`이진 트리 운행법 중 Left → Root → Right 순서로 방문하는 방법은?`,c:[`Inorder(중위 순회)`,`Preorder`,`Postorder`,`Levelorder`],a:0,e:`Inorder(중위 순회)는 Left → Root → Right 순서로 방문한다.`},
{s:3,t:`트리와 그래프`,q:`이진 트리 운행법 중 Left → Right → Root 순서로 방문하는 방법은?`,c:[`Inorder`,`Preorder`,`Postorder(후위 순회)`,`Levelorder`],a:2,e:`Postorder(후위 순회)는 Left → Right → Root 순서로 방문한다.`},
{s:3,t:`수식 표기법`,q:`Infix 표기법 A+B를 Postfix로 변환하면?`,c:[`+AB`,`AB+`,`A+B`,`BA+`],a:1,e:`Postfix는 연산자를 피연산자 뒤로 옮기므로 AB+가 된다.`},
{s:3,t:`수식 표기법`,q:`Postfix는 Infix 표기법에서 연산자를 피연산자 2개의 어느 위치로 이동한 것인가?`,c:[`왼쪽(앞)`,`오른쪽(뒤)`,`가운데`,`위치 무관`],a:1,e:`Postfix는 연산자를 피연산자 2개의 오른쪽(뒤)으로 이동시킨 표기법이다.`},
{s:3,t:`수식 표기법`,q:`Prefix는 Infix 표기법에서 연산자를 피연산자 2개의 어느 위치로 이동한 것인가?`,c:[`왼쪽(앞)`,`오른쪽(뒤)`,`가운데`,`맨 끝`],a:0,e:`Prefix는 연산자를 피연산자 2개의 왼쪽(앞)으로 이동시킨 표기법이다.`},
{s:3,t:`정렬`,q:`8, 5, 6, 2, 4를 삽입 정렬로 정렬할 때, 두 번째 값(5)을 첫 번째 값(8)과 비교하여 처리한 1회전 결과는?`,c:[`5 8 6 2 4`,`8 5 6 2 4`,`2 5 6 8 4`,`5 6 8 2 4`],a:0,e:`삽입 정렬 1회전은 5를 8 앞에 삽입하여 5 8 6 2 4가 된다.`},
{s:3,t:`정렬`,q:`선택 정렬(Selection Sort)에 대한 설명으로 옳은 것은?`,c:[`매 회전마다 인접한 두 값을 교환한다.`,`매 회전마다 남은 값 중 최소(또는 최대)값을 선택해 제자리에 놓는다.`,`리스트를 반으로 나누어 병합한다.`,`기준값을 정해 분할 정복한다.`],a:1,e:`선택 정렬은 매 회전마다 남은 값 중 최소값을 선택하여 해당 위치에 놓는다.`},
{s:3,t:`정렬`,q:`인접한 두 값을 비교하여 교환해 나가는 정렬 방식으로, 한 회전이 끝날 때마다 가장 큰(또는 작은) 값이 끝으로 이동하는 정렬은?`,c:[`삽입 정렬`,`선택 정렬`,`버블 정렬(Bubble Sort)`,`퀵 정렬`],a:2,e:`버블 정렬은 인접한 두 값을 비교·교환하며 한 회전마다 가장 큰 값이 끝으로 이동한다.`},
{s:3,t:`해싱`,q:`서로 다른 두 개 이상의 레코드가 같은 주소를 갖게 되는 현상은?`,c:[`Overflow`,`Collision(충돌)`,`Synonym`,`Bucket`],a:1,e:`Collision(충돌)은 서로 다른 레코드가 같은 주소를 갖는 현상이다.`},
{s:3,t:`해싱`,q:`충돌로 인해 같은 홈 주소(Home Address)를 갖는 레코드들의 집합은?`,c:[`Synonym`,`Collision`,`Bucket`,`Probe`],a:0,e:`Synonym은 충돌로 인해 같은 홈 주소를 갖는 레코드들의 집합이다.`},
{s:3,t:`해싱`,q:`해싱 함수의 종류가 아닌 것은?`,c:[`제산법(Division)`,`폴딩법(Folding)`,`이진 검색법`,`제곱법(Mid-Square)`],a:2,e:`이진 검색법은 탐색 기법이다. 해싱 함수에는 제산법, 폴딩법, 제곱법, 기수변환법 등이 있다.`},
{s:3,t:`DB 개념`,q:`데이터베이스에 저장될 데이터의 형(Type)과 구조, 이용 방식, 제약 조건 등을 명시하는 DBMS의 필수 기능은?`,c:[`정의 기능`,`조작 기능`,`제어 기능`,`보안 기능`],a:0,e:`정의 기능은 데이터의 형·구조·제약조건 등을 명시하는 기능이다.`},
{s:3,t:`DB 개념`,q:`데이터 검색, 갱신, 삽입, 삭제 등을 사용자와 데이터베이스 사이에서 처리하기 위한 인터페이스를 제공하는 DBMS 기능은?`,c:[`정의 기능`,`조작 기능(Manipulation)`,`제어 기능`,`저장 기능`],a:1,e:`조작 기능은 검색·갱신·삽입·삭제를 처리하는 인터페이스를 제공한다.`},
{s:3,t:`DB 개념`,q:`데이터베이스 설계 순서로 옳은 것은?`,c:[`요구조건 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현`,`개념적 설계 → 요구조건 분석 → 물리적 설계 → 논리적 설계 → 구현`,`요구조건 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계 → 구현`,`물리적 설계 → 개념적 설계 → 논리적 설계 → 요구조건 분석 → 구현`],a:0,e:`DB 설계는 요구조건 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현 순으로 진행된다.`},
{s:3,t:`DB 개념`,q:`목표 DBMS에 맞는 논리 스키마를 설계하고 트랜잭션의 인터페이스를 설계하는 단계는?`,c:[`개념적 설계`,`논리적 설계`,`물리적 설계`,`구현`],a:1,e:`논리적 설계는 목표 DBMS에 맞는 논리 스키마와 트랜잭션 인터페이스를 설계하는 단계이다.`},
{s:3,t:`DB 개념`,q:`E-R 다이어그램에서 개체(Entity) 타입을 나타내는 기호는?`,c:[`사각형`,`마름모`,`타원`,`선`],a:0,e:`사각형은 E-R 다이어그램에서 개체(Entity) 타입을 나타낸다.`},
{s:3,t:`DB 개념`,q:`E-R 다이어그램에서 관계(Relationship) 타입을 나타내는 기호는?`,c:[`사각형`,`마름모`,`타원`,`원`],a:1,e:`마름모는 E-R 다이어그램에서 관계(Relationship) 타입을 나타낸다.`},
{s:3,t:`키와 무결성`,q:`릴레이션을 구성하는 각각의 행을 의미하며, 그 수를 카디널리티라고 부르는 것은?`,c:[`속성(Attribute)`,`튜플(Tuple)`,`도메인(Domain)`,`스키마`],a:1,e:`튜플은 릴레이션의 각 행이며, 튜플의 수를 카디널리티라 한다.`},
{s:3,t:`키와 무결성`,q:`데이터베이스를 구성하는 가장 작은 논리적 단위로, 그 수를 디그리(차수)라고 부르는 것은?`,c:[`속성(Attribute)`,`튜플`,`도메인`,`릴레이션`],a:0,e:`속성은 가장 작은 논리적 단위이며, 속성의 수를 디그리(차수)라 한다.`},
{s:3,t:`키와 무결성`,q:`하나의 애트리뷰트가 취할 수 있는 같은 타입의 원자값들의 집합은?`,c:[`도메인(Domain)`,`튜플`,`카디널리티`,`릴레이션`],a:0,e:`도메인은 하나의 애트리뷰트가 취할 수 있는 원자값들의 집합이다.`},
{s:3,t:`키와 무결성`,q:`릴레이션의 특징으로 옳지 않은 것은?`,c:[`한 릴레이션에 포함된 튜플은 모두 상이하다.`,`한 릴레이션에 포함된 튜플 사이에는 순서가 없다.`,`속성의 값은 논리적으로 더 이상 쪼갤 수 없는 원자값만 저장한다.`,`한 릴레이션 내 속성의 명칭은 중복되어도 무방하다.`],a:3,e:`속성의 유일한 식별을 위해 속성의 명칭은 유일해야 한다.`},
{s:3,t:`키와 무결성`,q:`튜플을 유일하게 식별하기 위해 사용하는 속성들의 부분집합으로, 유일성과 최소성을 모두 만족해야 하는 키는?`,c:[`슈퍼키`,`후보키(Candidate Key)`,`외래키`,`대체키`],a:1,e:`후보키는 유일성과 최소성을 모두 만족하는, 기본키 후보가 될 수 있는 속성 집합이다.`},
{s:3,t:`키와 무결성`,q:`후보키 중 특별히 선정되어 중복된 값과 NULL 값을 가질 수 없는 키는?`,c:[`대체키`,`슈퍼키`,`기본키(Primary Key)`,`외래키`],a:2,e:`기본키는 후보키 중 선정된 주키로 중복값과 NULL을 가질 수 없다.`},
{s:3,t:`키와 무결성`,q:`후보키가 둘 이상일 때 기본키를 제외한 나머지 후보키를 의미하는 것은?`,c:[`대체키(Alternate Key)`,`슈퍼키`,`외래키`,`기본키`],a:0,e:`대체키(보조키)는 기본키로 선정되지 않은 나머지 후보키이다.`},
{s:3,t:`키와 무결성`,q:`유일성은 만족하지만 최소성은 만족시키지 못하는 키는?`,c:[`후보키`,`슈퍼키(Super Key)`,`기본키`,`대체키`],a:1,e:`슈퍼키는 유일성은 만족하지만 최소성은 만족하지 못하는 키이다.`},
{s:3,t:`키와 무결성`,q:`다른 릴레이션의 기본키를 참조하는 속성 또는 속성들의 집합은?`,c:[`외래키(Foreign Key)`,`슈퍼키`,`대체키`,`후보키`],a:0,e:`외래키는 다른 릴레이션의 기본키를 참조하는 속성이다.`},
{s:3,t:`키와 무결성`,q:`기본 테이블의 기본키를 구성하는 어떤 속성도 Null 값이나 중복값을 가질 수 없다는 무결성 규정은?`,c:[`개체 무결성`,`참조 무결성`,`도메인 무결성`,`사용자 정의 무결성`],a:0,e:`개체 무결성은 기본키가 Null이나 중복값을 가질 수 없다는 규정이다.`},
{s:3,t:`키와 무결성`,q:`외래키 값은 Null이거나 참조 릴레이션의 기본키 값과 동일해야 한다는 무결성 규정은?`,c:[`개체 무결성`,`참조 무결성(Referential Integrity)`,`키 무결성`,`속성 무결성`],a:1,e:`참조 무결성은 외래키 값이 Null이거나 참조 릴레이션의 기본키와 동일해야 한다는 규정이다.`},
{s:3,t:`키와 무결성`,q:`데이터베이스에서 아직 알려지지 않거나 모르는 값을 나타내기 위해 사용하는 특수한 데이터는?`,c:[`0(Zero)`,`공백(Space)`,`NULL 값`,`빈 문자열`],a:2,e:`NULL 값은 아직 알려지지 않거나 모르는 값을 나타내는 특수한 데이터이다.`},
{s:3,t:`관계대수`,q:`관계형 데이터베이스에서 원하는 정보를 검색하기 위해 어떻게 유도하는지를 기술하는 절차적 언어는?`,c:[`관계대수(Relational Algebra)`,`관계해석`,`SQL`,`QBE`],a:0,e:`관계대수는 정보를 유도하는 절차를 기술하는 절차적 언어이다.`},
{s:3,t:`관계대수`,q:`릴레이션에서 선택 조건을 만족하는 튜플의 부분집합을 구하는 순수 관계 연산자와 그 기호는?`,c:[`Select(σ)`,`Project(π)`,`Join`,`Division(÷)`],a:0,e:`Select(σ)는 조건을 만족하는 튜플의 부분집합을 구하는 연산이다.`},
{s:3,t:`관계대수`,q:`주어진 릴레이션에서 속성 리스트에 제시된 속성 값만을 추출하는 순수 관계 연산자와 그 기호는?`,c:[`Select(σ)`,`Project(π)`,`Join`,`Division`],a:1,e:`Project(π)는 지정된 속성 값만을 추출하는 연산이다.`},
{s:3,t:`관계대수`,q:`공통 속성을 중심으로 두 개의 릴레이션을 하나로 합쳐 새로운 릴레이션을 만드는 연산은?`,c:[`Select`,`Project`,`Join`,`Division`],a:2,e:`Join은 공통 속성을 중심으로 두 릴레이션을 합치는 연산이다.`},
{s:3,t:`관계대수`,q:`X⊃Y인 두 릴레이션 R(X), S(Y)에서 R의 속성이 S의 속성값을 모두 가진 튜플 중 S가 가진 속성을 제외한 속성만 구하는 연산은?`,c:[`Join`,`Division(÷)`,`Project`,`Union`],a:1,e:`Division(÷)은 S의 속성값을 모두 가진 튜플에서 S의 속성을 제외한 속성을 구하는 연산이다.`},
{s:3,t:`관계대수`,q:`일반 집합 연산자 중 교차곱(CARTESIAN PRODUCT)의 기호는?`,c:[`∪`,`∩`,`-`,`×`],a:3,e:`교차곱의 기호는 ×이다.`},
{s:3,t:`관계대수`,q:`교차곱 연산 결과 릴레이션의 카디널리티는 어떻게 계산되는가?`,c:[`두 릴레이션의 카디널리티를 더한 값`,`두 릴레이션의 카디널리티를 곱한 값`,`두 릴레이션 중 큰 값`,`두 릴레이션의 평균값`],a:1,e:`교차곱의 카디널리티는 두 릴레이션의 카디널리티를 곱한 값과 같다.`},
{s:3,t:`관계대수`,q:`관계 데이터 모델의 제안자인 코드(Codd)가 술어 해석에 기반을 두고 제안한, 원하는 정보가 무엇인지만 정의하는 비절차적 언어는?`,c:[`관계대수`,`관계해석(Relational Calculus)`,`SQL`,`QBE`],a:1,e:`관계해석은 코드가 술어 해석에 기반해 제안한 비절차적 언어이다.`},
{s:3,t:`정규화`,q:`잘못 설계된 관계형 스키마를 더 작은 속성의 세트로 쪼개어 바람직한 스키마로 만들어가는 과정은?`,c:[`정규화(Normalization)`,`역정규화`,`조인`,`인덱싱`],a:0,e:`정규화는 잘못 설계된 스키마를 작은 속성 세트로 분해해 나가는 과정이다.`},
{s:3,t:`정규화`,q:`정규화를 거치지 않아 릴레이션 조작 시 발생하는 예기치 못한 곤란한 현상은?`,c:[`이상(Anomaly)`,`교착상태`,`오버플로우`,`단편화`],a:0,e:`이상(Anomaly)은 정규화 미비로 발생하는 예기치 못한 현상이다.`},
{s:3,t:`정규화`,q:`이상(Anomaly)의 종류로 옳지 않은 것은?`,c:[`삽입 이상`,`삭제 이상`,`갱신 이상`,`선택 이상`],a:3,e:`이상의 종류는 삽입 이상, 삭제 이상, 갱신 이상이다.`},
{s:3,t:`정규화`,q:`제1정규형(1NF)이 되기 위한 조건은?`,c:[`부분적 함수 종속 제거`,`도메인이 원자값(Atomic)이어야 함`,`이행적 함수 종속 제거`,`다치 종속 제거`],a:1,e:`1NF는 모든 도메인이 원자값으로 구성되어야 한다는 조건을 만족해야 한다.`},
{s:3,t:`정규화`,q:`제2정규형(2NF)이 되기 위해 제거해야 하는 것은?`,c:[`부분적 함수 종속`,`이행적 함수 종속`,`다치 종속`,`결정자가 후보키가 아닌 것`],a:0,e:`2NF는 부분적 함수 종속을 제거해야 한다.`},
{s:3,t:`정규화`,q:`제3정규형(3NF)이 되기 위해 제거해야 하는 것은?`,c:[`부분적 함수 종속`,`이행적 함수 종속(Transitive Dependency)`,`다치 종속`,`조인 종속성`],a:1,e:`3NF는 이행적 함수 종속을 제거해야 한다.`},
{s:3,t:`정규화`,q:`BCNF가 되기 위해 제거해야 하는 것은?`,c:[`결정자이면서 후보키가 아닌 것`,`부분적 함수 종속`,`다치 종속`,`조인 종속성`],a:0,e:`BCNF는 결정자이면서 후보키가 아닌 것을 제거해야 한다.`},
{s:3,t:`정규화`,q:`A → B이고 B → C일 때 A → C를 만족하는 함수 종속 관계는?`,c:[`부분 함수 종속`,`이행적 종속(Transitive Dependency)`,`완전 함수 종속`,`다치 종속`],a:1,e:`이행적 종속은 A→B, B→C일 때 A→C를 만족하는 관계이다.`},
{s:3,t:`정규화`,q:`데이터들이 어떤 기준값에 의해 종속되는 것을 의미하며, '학번 → 이름'처럼 표기하는 개념은?`,c:[`함수적 종속(Functional Dependency)`,`이행적 종속`,`다치 종속`,`조인 종속`],a:0,e:`함수적 종속은 데이터가 어떤 기준값에 의해 종속되는 것을 의미한다.`},
{s:3,t:`시스템카탈로그·뷰`,q:`시스템 그 자체에 관련된 다양한 객체 정보를 포함하는 시스템 데이터베이스로, 사용자가 검색은 가능하나 갱신은 불가능한 것은?`,c:[`시스템 카탈로그(System Catalog)`,`데이터 사전`,`뷰(View)`,`인덱스`],a:0,e:`시스템 카탈로그는 검색은 가능하나 사용자가 직접 갱신할 수는 없는 시스템 데이터베이스이다.`},
{s:3,t:`시스템카탈로그·뷰`,q:`하나 이상의 기본 테이블로부터 유도된, 이름을 가지는 가상 테이블은?`,c:[`뷰(View)`,`인덱스`,`트리거`,`프로시저`],a:0,e:`뷰는 기본 테이블로부터 유도된 이름을 가지는 가상 테이블이다.`},
{s:3,t:`시스템카탈로그·뷰`,q:`뷰(View)의 특징으로 옳지 않은 것은?`,c:[`논리적 데이터 독립성이 제공된다.`,`접근 제어를 통한 자동 보안이 제공된다.`,`독립적인 인덱스를 가질 수 있다.`,`삽입, 삭제, 갱신 연산에 제약이 따른다.`],a:2,e:`뷰는 독립적인 인덱스를 가질 수 없다는 것이 단점이다.`},
{s:3,t:`트랜잭션`,q:`트랜잭션의 특성 중 트랜잭션 실행 중 다른 트랜잭션의 연산이 끼어들 수 없음을 의미하는 것은?`,c:[`Atomicity(원자성)`,`Consistency(일관성)`,`Isolation(독립성)`,`Durability(영속성)`],a:2,e:`Isolation(독립성)은 트랜잭션 실행 중 다른 트랜잭션이 끼어들 수 없다는 특성이다.`},
{s:3,t:`트랜잭션`,q:`트랜잭션의 연산은 데이터베이스에 모두 반영되도록 완료되든지 아니면 전혀 반영되지 않도록 복구되어야 한다는 특성은?`,c:[`Atomicity(원자성)`,`Consistency`,`Isolation`,`Durability`],a:0,e:`Atomicity(원자성)는 모두 반영(Commit)되거나 전혀 반영되지 않도록(Rollback) 해야 하는 특성이다.`},
{s:3,t:`트랜잭션`,q:`성공적으로 완료된 트랜잭션의 결과는 시스템이 고장나더라도 영구적으로 반영되어야 한다는 특성은?`,c:[`원자성`,`일관성`,`독립성`,`영속성(Durability)`],a:3,e:`영속성(Durability)은 완료된 트랜잭션 결과가 시스템 고장에도 영구 반영되어야 한다는 특성이다.`},
{s:3,t:`SQL-DDL`,q:`스키마, 도메인, 테이블, 뷰, 인덱스를 정의하거나 변경, 삭제할 때 사용하는 언어는?`,c:[`DDL(데이터 정의어)`,`DML(데이터 조작어)`,`DCL(데이터 제어어)`,`TCL`],a:0,e:`DDL은 스키마·도메인·테이블·뷰·인덱스를 정의·변경·삭제하는 언어이다.`},
{s:3,t:`SQL-DDL`,q:`테이블에 대한 정의를 변경할 때 사용하는 DDL 명령어는?`,c:[`CREATE`,`ALTER`,`DROP`,`UPDATE`],a:1,e:`ALTER는 TABLE에 대한 정의를 변경하는 데 사용된다.`},
{s:3,t:`SQL-DDL`,q:`DROP TABLE 명령문에서 제거할 요소를 참조하는 다른 모든 개체를 함께 제거하는 옵션은?`,c:[`CASCADE`,`RESTRICT`,`DEFAULT`,`UNIQUE`],a:0,e:`CASCADE는 참조하는 다른 모든 개체를 함께 제거하는 옵션이다.`},
{s:3,t:`SQL-DDL`,q:`DROP TABLE 명령문에서 다른 개체가 제거할 요소를 참조 중일 때 제거를 취소하는 옵션은?`,c:[`CASCADE`,`RESTRICT`,`CHECK`,`NOT NULL`],a:1,e:`RESTRICT는 다른 개체가 참조 중이면 제거를 취소하는 옵션이다.`},
{s:3,t:`SQL-DDL`,q:`CREATE TABLE 문에서 기본키를 지정할 때 사용하는 키워드는?`,c:[`UNIQUE`,`PRIMARY KEY`,`FOREIGN KEY`,`CHECK`],a:1,e:`PRIMARY KEY는 CREATE TABLE 문에서 기본키를 지정하는 키워드이다.`},
{s:3,t:`SQL-DML`,q:`데이터베이스 사용자가 저장된 데이터를 실질적으로 처리하는 데 사용하는 언어로, SELECT/INSERT/DELETE/UPDATE로 구성된 것은?`,c:[`DDL`,`DML(데이터 조작어)`,`DCL`,`DQL`],a:1,e:`DML은 SELECT, INSERT, DELETE, UPDATE로 구성된 데이터 조작어이다.`},
{s:3,t:`SQL-DML`,q:`기본 테이블에 새로운 튜플을 삽입할 때 사용하는 명령문은?`,c:[`INSERT INTO ~ VALUES ~`,`UPDATE ~ SET ~`,`DELETE FROM ~`,`SELECT ~ FROM ~`],a:0,e:`INSERT INTO ~ VALUES ~는 새로운 튜플을 삽입하는 명령문이다.`},
{s:3,t:`SQL-DML`,q:`기본 테이블에 있는 튜플 중 특정 튜플의 내용을 변경할 때 사용하는 명령문은?`,c:[`INSERT INTO ~`,`UPDATE ~ SET ~`,`DELETE FROM ~`,`ALTER TABLE ~`],a:1,e:`UPDATE ~ SET ~는 튜플의 내용을 변경하는 명령문이다.`},
{s:3,t:`SQL-DML`,q:`SELECT문에서 검색된 결과 중 중복된 튜플을 제거하고 첫 번째 한 개만 검색하는 예약어는?`,c:[`DISTINCT`,`UNIQUE`,`ONLY`,`SINGLE`],a:0,e:`DISTINCT는 중복된 튜플 중 첫 번째 한 개만 검색하는 예약어이다.`},
{s:3,t:`SQL-DML`,q:`SELECT문에서 그룹에 대한 조건을 지정할 때 사용하는 절은?`,c:[`WHERE절`,`GROUP BY절`,`HAVING절`,`ORDER BY절`],a:2,e:`HAVING절은 GROUP BY로 묶인 그룹에 대한 조건을 지정한다.`},
{s:3,t:`SQL-DML`,q:`SELECT문에서 정렬 방식을 내림차순으로 지정하는 예약어는?`,c:[`ASC`,`DESC`,`ORDER`,`SORT`],a:1,e:`DESC는 내림차순, ASC(또는 생략)는 오름차순 정렬이다.`},
{s:3,t:`SQL-DML`,q:`조건 연산자 LIKE에서 문자 하나를 대표하는 대표 문자는?`,c:[`%`,`_`,`#`,`*`],a:1,e:`밑줄(_)은 문자 하나를 대표하는 문자이다.`},
{s:3,t:`SQL-DML`,q:`조건 연산자 LIKE에서 모든 문자를 대표하는 대표 문자는?`,c:[`%`,`_`,`#`,`?`],a:0,e:`%는 모든 문자를 대표하는 문자이다.`},
{s:3,t:`SQL-DML`,q:`그룹별 튜플 수를 구하는 그룹 함수는?`,c:[`SUM`,`COUNT`,`AVG`,`MAX`],a:1,e:`COUNT는 그룹별 튜플 수를 구하는 함수이다.`},
{s:3,t:`SQL-DML`,q:`데이터 조작문의 네 가지 유형에 해당하지 않는 것은?`,c:[`SELECT(검색)`,`INSERT(삽입)`,`GRANT(권한부여)`,`UPDATE(변경)`],a:2,e:`GRANT는 DCL 명령어이다. DML의 네 유형은 SELECT, INSERT, DELETE, UPDATE이다.`},
{s:3,t:`SQL-DML`,q:`조인하는 두 테이블에 있는 튜플들의 순서쌍을 결과로 반환하며, 결과 행의 수가 두 테이블 행 수를 곱한 것과 같은 조인은?`,c:[`INNER JOIN`,`OUTER JOIN`,`CROSS JOIN(교차 조인)`,`SELF JOIN`],a:2,e:`CROSS JOIN(교차 조인)은 두 테이블 행 수를 곱한 만큼의 순서쌍을 반환한다.`},
{s:3,t:`SQL-DCL`,q:`데이터의 보안, 무결성, 회복, 병행 수행 제어 등을 정의하는 데 사용되는 언어는?`,c:[`DDL`,`DML`,`DCL(데이터 제어어)`,`DQL`],a:2,e:`DCL은 보안·무결성·회복·병행 제어를 정의하는 언어이다.`},
{s:3,t:`SQL-DCL`,q:`수행된 결과를 실제 물리적 디스크에 저장하고 작업이 정상적으로 완료되었음을 알려주는 DCL 명령어는?`,c:[`COMMIT`,`ROLLBACK`,`GRANT`,`REVOKE`],a:0,e:`COMMIT은 수행 결과를 디스크에 저장하고 정상 완료를 알리는 명령어이다.`},
{s:3,t:`SQL-DCL`,q:`데이터베이스 조작 작업이 비정상적으로 종료되었을 때 원래 상태로 복구하는 DCL 명령어는?`,c:[`COMMIT`,`ROLLBACK`,`GRANT`,`SAVEPOINT`],a:1,e:`ROLLBACK은 비정상 종료 시 원래 상태로 복구하는 명령어이다.`},
{s:3,t:`SQL-DCL`,q:`데이터베이스 사용자의 사용 권한을 취소하는 DCL 명령어는?`,c:[`GRANT`,`REVOKE`,`COMMIT`,`ROLLBACK`],a:1,e:`REVOKE는 사용 권한을 취소하는 명령어이며, GRANT는 권한을 부여하는 명령어이다.`},
{s:3,t:`DB 기타`,q:`작성된 SQL이 가장 효율적으로 수행되도록 최적의 경로를 찾아주는 모듈로, RBO와 CBO로 구분되는 것은?`,c:[`옵티마이저(Optimizer)`,`프로시저`,`트리거`,`인덱스`],a:0,e:`옵티마이저는 SQL의 최적 실행 경로를 찾는 모듈로 RBO, CBO로 구분된다.`},
{s:3,t:`DB 기타`,q:`절차형 SQL을 활용해 특정 기능을 수행하며, 호출을 통해 미리 저장해 놓은 SQL 작업을 수행하는 것은?`,c:[`뷰(View)`,`프로시저(Procedure)`,`트랜잭션`,`인덱스`],a:1,e:`프로시저는 절차형 SQL로 미리 저장된 작업을 호출을 통해 수행한다.`},
{s:3,t:`DB 기타`,q:`애플리케이션의 성능 관리를 위해 접속자, 자원 현황, 트랜잭션 수행 내역, 장애 진단 등을 모니터링하는 도구는?`,c:[`APM`,`DBMS`,`ORM`,`IDE`],a:0,e:`APM(Application Performance Management)은 애플리케이션 성능을 모니터링하는 도구이다.`},
{s:3,t:`DB 기타`,q:`테스트를 통해 오류를 발견한 후, 오류가 발생한 소스 코드를 추적하며 수정하는 작업은?`,c:[`리팩토링`,`디버깅(Debugging)`,`형상관리`,`최적화`],a:1,e:`디버깅은 테스트로 발견한 오류를 추적하며 소스 코드를 수정하는 작업이다.`},
];

const SUBJECT_LABEL = {1:'1과목 정보시스템 기반 기술', 2:'2과목 프로그래밍 언어 활용', 3:'3과목 데이터베이스 활용'};
const CIRCLE = ['①','②','③','④'];
const STORE_KEY = 'ipsQuizStatsV2';

function loadStats(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {perQ:{}}; }
  catch(e){ return {perQ:{}}; }
}
function saveStats(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let stats = loadStats();
function getStat(i){
  return stats.perQ[i] || {seen:0, correct:0, wrong:0, lastResult:null, lastChoice:null, lastAt:0};
}
function recordAnswer(i, isCorrect, choiceIdx){
  const cur = getStat(i);
  cur.seen++;
  if(isCorrect){ cur.correct++; } else { cur.wrong++; }
  cur.lastResult = isCorrect ? 'O' : 'X';
  cur.lastChoice = choiceIdx;
  cur.lastAt = Date.now();
  stats.perQ[i] = cur;
  saveStats(stats);
}
function clearStat(i){ delete stats.perQ[i]; saveStats(stats); }
function resetAllStats(){ stats = {perQ:{}}; saveStats(stats); }

let state = { view:'home', subjectFilter:'all', countFilter:20, session:null };

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function indicesForSubject(sub){
  return DATA.map((q,i)=>i).filter(i => sub==='all' ? true : DATA[i].s === sub);
}
function startQuiz(indices, opts){
  opts = opts || {};
  let pool = opts.shuffleQuestions === false ? indices.slice() : shuffle(indices);
  if(opts.limit){ pool = pool.slice(0, opts.limit); }
  state.session = { queue: pool, pos: 0, correctCount:0, wrongIdx: [], answered:false, chosen:null, title: opts.title || '' };
  state.view = 'quiz';
  render();
}

function overallAccuracy(){
  let seen=0, correct=0;
  Object.values(stats.perQ).forEach(v=>{ seen+=v.seen; correct+=v.correct; });
  return {seen, correct, rate: seen ? Math.round(correct/seen*100) : 0};
}
function wrongList(){
  return Object.keys(stats.perQ).map(k=>parseInt(k,10))
    .filter(i => stats.perQ[i].wrong > 0)
    .sort((a,b)=> stats.perQ[b].lastAt - stats.perQ[a].lastAt);
}
function unresolvedWrongIndices(){
  return wrongList().filter(i => stats.perQ[i].lastResult === 'X');
}
function tagStatsSorted(){
  const map = {};
  DATA.forEach((q,i)=>{
    const st = getStat(i);
    if(st.seen===0) return;
    const key = q.s+'::'+q.t;
    if(!map[key]) map[key] = {s:q.s, t:q.t, seen:0, wrong:0, idxs:[]};
    map[key].seen += st.seen;
    map[key].wrong += st.wrong;
    map[key].idxs.push(i);
  });
  return Object.values(map).filter(v=>v.wrong>0).sort((a,b)=> b.wrong-a.wrong || (b.wrong/b.seen)-(a.wrong/a.seen));
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  const app = document.getElementById('app');
  if(state.view === 'quiz'){ app.innerHTML = topbarQuiz() + quizView(); }
  else {
    app.innerHTML = topbarNav() + (
      state.view === 'home' ? homeView() :
      state.view === 'wrong' ? wrongView() :
      state.view === 'weak' ? weakView() :
      state.view === 'result' ? resultView() : homeView()
    );
  }
  wire();
}

function topbarNav(){
  const tabs = ['home','wrong','weak'];
  const labels = {home:'홈', wrong:'오답노트', weak:'자주 틀리는 개념'};
  return `<div class="topbar">
    <div class="brand">
      <h1>정보처리산업기사 핵심요약 퀴즈</h1>
      <p>핵심요약집 기반 4지선다 자가 학습</p>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<button class="tab-btn ${state.view===t?'is-active':''}" data-nav="${t}">${labels[t]}</button>`).join('')}
    </div>
  </div>`;
}
function topbarQuiz(){
  return `<div class="topbar">
    <div class="brand">
      <h1>${state.session.title || '퀴즈 진행 중'}</h1>
      <p>정답을 고른 뒤 해설을 확인하세요</p>
    </div>
    <button class="quit-btn" data-action="quit">그만하기</button>
  </div>`;
}

function homeView(){
  const acc = overallAccuracy();
  const wCount = unresolvedWrongIndices().length;
  const subjects = [['all','전체'],[1,'1과목'],[2,'2과목'],[3,'3과목']];
  const counts = [10,20,30,'all'];
  return `
  <div class="stat-tiles">
    <div class="stat-tile"><span class="label">누적 풀이</span><span class="value">${acc.seen}</span></div>
    <div class="stat-tile"><span class="label">정답률</span><span class="value">${acc.rate}%</span></div>
    <div class="stat-tile"><span class="label">복습 필요</span><span class="value">${wCount}</span></div>
  </div>
  ${wCount>0 ? `<div class="cta-card">
    <span><strong>오답 ${wCount}개</strong>가 복습을 기다리고 있어요.</span>
    <button class="ghost-btn" data-action="retry-wrong">지금 다시 풀기</button>
  </div>` : ''}
  <div class="card">
    <div class="section-title">과목 선택</div>
    <div class="chip-group" id="subject-chips">
      ${subjects.map(([v,l])=>`<button class="chip ${state.subjectFilter==v?'is-active':''}" data-subject="${v}">${l}</button>`).join('')}
    </div>
    <div class="section-title">문제 수</div>
    <div class="chip-group" id="count-chips">
      ${counts.map(c=>`<button class="chip ${state.countFilter==c?'is-active':''}" data-count="${c}">${c==='all'?'전체':c+'문제'}</button>`).join('')}
    </div>
    <button class="primary-btn" data-action="start">퀴즈 시작</button>
  </div>
  <p class="footer-note">총 ${DATA.length}문제 · <button class="reset-link" data-action="reset-all">학습 기록 초기화</button></p>
  `;
}

function quizView(){
  const s = state.session;
  const total = s.queue.length;
  const qIdx = s.queue[s.pos];
  const q = DATA[qIdx];
  const pct = Math.round((s.pos)/total*100);
  const answered = s.answered;
  return `
  <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div class="card">
    <div class="qmeta">
      <span class="pill">${SUBJECT_LABEL[q.s]}</span>
      <span class="pill tag">${esc(q.t)}</span>
      <span class="qcounter">${s.pos+1} / ${total}</span>
    </div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="choice-list">
      ${q.c.map((c,ci)=>{
        let cls = 'choice-btn';
        if(answered){
          cls += ' is-disabled';
          if(ci===q.a) cls += ' is-correct';
          else if(ci===s.chosen) cls += ' is-wrong';
        }
        return `<button class="${cls}" data-choice="${ci}" ${answered?'disabled':''}><span class="num">${CIRCLE[ci]}</span><span>${esc(c)}</span></button>`;
      }).join('')}
    </div>
    ${answered ? `<div class="explain"><b>${s.chosen===q.a?'정답입니다.':'오답입니다.'}</b> ${esc(q.e)}</div>` : ''}
    ${answered ? `<div class="qfooter"><button class="primary-btn" style="width:auto;padding:10px 22px;" data-action="next">${s.pos+1===total?'결과 보기':'다음 문제'}</button></div>` : ''}
  </div>
  `;
}

function resultView(){
  const s = state.session;
  const total = s.queue.length;
  const rate = total ? Math.round(s.correctCount/total*100) : 0;
  return `
  <div class="card result-score">
    <div class="big">${s.correctCount} / ${total}</div>
    <div class="sub">정답률 ${rate}%</div>
  </div>
  ${s.wrongIdx.length>0 ? `<div class="card">
    <div class="section-title">이번 회차에서 틀린 문제</div>
    ${s.wrongIdx.map(i=>`<div style="font-size:.86rem;color:var(--ink-soft);padding:6px 0;border-bottom:1px solid var(--line);">${esc(DATA[i].q)}</div>`).join('')}
  </div>` : ''}
  <button class="primary-btn" data-action="home" style="margin-bottom:10px;">홈으로</button>
  ${s.wrongIdx.length>0 ? `<button class="ghost-btn" style="width:100%;" data-action="retry-session-wrong">방금 틀린 문제만 다시 풀기</button>` : ''}
  `;
}

function wrongView(){
  const need = unresolvedWrongIndices();
  const done = wrongList().filter(i => stats.perQ[i].lastResult === 'O');
  if(need.length===0 && done.length===0){
    return `<div class="empty-state">아직 오답 기록이 없습니다.<br>퀴즈를 풀면 틀린 문제가 여기에 쌓여요.</div>`;
  }
  function item(i){
    const q = DATA[i]; const st = stats.perQ[i];
    return `<div class="wrong-item">
      <div class="head">
        <span class="pill">${SUBJECT_LABEL[q.s]}</span>
        <span class="pill tag">${esc(q.t)}</span>
        <span class="count-badge">오답 ${st.wrong}회</span>
      </div>
      <div class="qtext">${esc(q.q)}</div>
      ${st.lastChoice!==null && st.lastChoice!==q.a ? `<div class="last-pick">마지막 선택: ${CIRCLE[st.lastChoice]} ${esc(q.c[st.lastChoice])}</div>` : ''}
      <div class="answer-line">정답: ${CIRCLE[q.a]} ${esc(q.c[q.a])}</div>
      <div class="explain">${esc(q.e)}</div>
      <button class="clear-link" data-clear="${i}">이 기록 삭제</button>
    </div>`;
  }
  return `
  ${need.length>0 ? `<button class="primary-btn" style="margin-bottom:14px;" data-action="retry-wrong">복습 필요 ${need.length}개 다시 풀기</button>` : ''}
  ${need.length>0 ? `<div class="section-title">복습 필요</div>${need.map(item).join('')}` : ''}
  ${done.length>0 ? `<div class="section-title" style="margin-top:18px;">복습 완료</div>${done.map(item).join('')}` : ''}
  `;
}

function weakView(){
  const rows = tagStatsSorted();
  if(rows.length===0){
    return `<div class="empty-state">아직 통계가 부족합니다.<br>퀴즈를 더 풀어보세요.</div>`;
  }
  const maxWrong = Math.max(...rows.map(r=>r.wrong));
  return rows.map(r=>{
    const rate = Math.round(r.wrong/r.seen*100);
    const width = Math.round(r.wrong/maxWrong*100);
    const color = rate>=60 ? 'var(--wrong)' : 'var(--warn)';
    return `<div class="weak-row" data-tag-idxs="${r.idxs.join(',')}">
      <div class="top">
        <span class="name">${esc(r.t)} <span style="color:var(--ink-soft);font-weight:400;">· ${SUBJECT_LABEL[r.s]}</span></span>
        <span class="stats">오답 ${r.wrong} / 시도 ${r.seen} (${rate}%)</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${color};"></div></div>
      <button class="ghost-btn" style="margin-top:10px;" data-action="drill-tag" data-idxs="${r.idxs.join(',')}" data-title="${esc(r.t)}">이 개념 집중 풀기</button>
    </div>`;
  }).join('');
}

function wire(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.view = el.dataset.nav; render(); });
  });
  const subjBox = document.getElementById('subject-chips');
  if(subjBox){
    subjBox.querySelectorAll('[data-subject]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const v = el.dataset.subject;
        state.subjectFilter = v==='all' ? 'all' : parseInt(v,10);
        render();
      });
    });
  }
  const countBox = document.getElementById('count-chips');
  if(countBox){
    countBox.querySelectorAll('[data-count]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const v = el.dataset.count;
        state.countFilter = v==='all' ? 'all' : parseInt(v,10);
        render();
      });
    });
  }
  const startBtn = document.querySelector('[data-action="start"]');
  if(startBtn){
    startBtn.addEventListener('click', ()=>{
      const idxs = indicesForSubject(state.subjectFilter);
      const limit = state.countFilter==='all' ? idxs.length : state.countFilter;
      startQuiz(idxs, {limit, title: SUBJECT_LABEL[state.subjectFilter] || '전체 문제'});
    });
  }
  const retryBtn = document.querySelector('[data-action="retry-wrong"]');
  if(retryBtn){
    retryBtn.addEventListener('click', ()=>{
      startQuiz(unresolvedWrongIndices(), {title:'오답 복습'});
    });
  }
  const resetBtn = document.querySelector('[data-action="reset-all"]');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      if(confirm('모든 학습 기록(정답률, 오답노트)을 초기화할까요?')){ resetAllStats(); render(); }
    });
  }
  document.querySelectorAll('[data-choice]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = state.session;
      if(s.answered) return;
      const ci = parseInt(el.dataset.choice,10);
      const qIdx = s.queue[s.pos];
      const q = DATA[qIdx];
      const isCorrect = ci===q.a;
      s.answered = true; s.chosen = ci;
      if(isCorrect) s.correctCount++; else s.wrongIdx.push(qIdx);
      recordAnswer(qIdx, isCorrect, ci);
      render();
    });
  });
  const nextBtn = document.querySelector('[data-action="next"]');
  if(nextBtn){
    nextBtn.addEventListener('click', ()=>{
      const s = state.session;
      if(s.pos+1 < s.queue.length){
        s.pos++; s.answered=false; s.chosen=null; render();
      } else {
        state.view='result'; render();
      }
    });
  }
  const quitBtn = document.querySelector('[data-action="quit"]');
  if(quitBtn){
    quitBtn.addEventListener('click', ()=>{
      if(confirm('퀴즈를 그만두고 홈으로 이동할까요?')){ state.view='home'; render(); }
    });
  }
  const homeBtn = document.querySelector('[data-action="home"]');
  if(homeBtn){ homeBtn.addEventListener('click', ()=>{ state.view='home'; render(); }); }
  const retrySessBtn = document.querySelector('[data-action="retry-session-wrong"]');
  if(retrySessBtn){
    retrySessBtn.addEventListener('click', ()=>{
      startQuiz(state.session.wrongIdx, {title:'방금 틀린 문제', shuffleQuestions:false});
    });
  }
  document.querySelectorAll('[data-clear]').forEach(el=>{
    el.addEventListener('click', ()=>{
      clearStat(parseInt(el.dataset.clear,10)); render();
    });
  });
  document.querySelectorAll('[data-action="drill-tag"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idxs = el.dataset.idxs.split(',').map(Number);
      startQuiz(idxs, {title: el.dataset.title + ' 집중풀기'});
    });
  });
}

render();
</script>

<style>
.install-banner{
  position:fixed;left:0;right:0;bottom:0;z-index:999;
  background:var(--card);border-top:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 -4px 16px rgba(0,0,0,.08);
}
.install-banner p{margin:0;font-size:.82rem;color:var(--ink-soft);flex:1;line-height:1.4;}
.install-banner button{
  border:none;background:var(--accent);color:#fff;font-weight:700;
  padding:9px 16px;border-radius:8px;font-size:.84rem;cursor:pointer;flex:none;
}
.install-banner .close-x{
  background:none;color:var(--ink-soft);font-weight:400;padding:4px 8px;
}
</style>
<script>
(function(){
  // 서비스워커 등록(오프라인 캐시, best-effort) - 지원되지 않는 환경에서는 조용히 무시됨
  if('serviceWorker' in navigator){
    try{
      var swSrc = "self.addEventListener('install',e=>self.skipWaiting());" +
        "self.addEventListener('activate',e=>self.clients.claim());" +
        "self.addEventListener('fetch',function(e){" +
        "  e.respondWith(caches.open('ipe-quiz-v1').then(function(cache){" +
        "    return cache.match(e.request).then(function(hit){" +
        "      var fetched = fetch(e.request).then(function(res){ cache.put(e.request, res.clone()); return res; }).catch(function(){ return hit; });" +
        "      return hit || fetched;" +
        "    });" +
        "  }));" +
        "});";
      var blob = new Blob([swSrc], {type:'application/javascript'});
      var swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(function(){});
    }catch(e){}
  }

  // 설치 배너: Android/Chrome은 beforeinstallprompt, iOS는 안내 문구
  var deferredPrompt = null;
  var STORAGE_KEY = 'ipsInstallBannerDismissed';
  function alreadyDismissed(){ return localStorage.getItem(STORAGE_KEY) === '1'; }
  function dismiss(){ localStorage.setItem(STORAGE_KEY, '1'); var b = document.getElementById('install-banner'); if(b) b.remove(); }

  function showBanner(mode){
    if(alreadyDismissed() || document.getElementById('install-banner')) return;
    var div = document.createElement('div');
    div.id = 'install-banner';
    div.className = 'install-banner';
    if(mode === 'android'){
      div.innerHTML = '<p>홈 화면에 추가하면 앱처럼 바로 열 수 있어요.</p>' +
        '<button id="install-btn">설치</button>' +
        '<button class="close-x" id="install-close">닫기</button>';
    } else {
      div.innerHTML = '<p>Safari 공유 버튼 → '홈 화면에 추가'를 누르면 앱처럼 설치돼요.</p>' +
        '<button class="close-x" id="install-close">닫기</button>';
    }
    document.body.appendChild(div);
    var closeBtn = document.getElementById('install-close');
    if(closeBtn) closeBtn.addEventListener('click', dismiss);
    var installBtn = document.getElementById('install-btn');
    if(installBtn){
      installBtn.addEventListener('click', function(){
        if(!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function(){ deferredPrompt = null; dismiss(); });
      });
    }
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    showBanner('android');
  });

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isIOS && !isStandalone){
    setTimeout(function(){ showBanner('ios'); }, 1200);
  }
})();
</script>
